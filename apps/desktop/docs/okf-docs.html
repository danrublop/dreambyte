eed })</code> each frame for the slow orbit. Pair it with <code>applyDreambyteThreeEnvironment('track_rolling_topdown', …)</code>. Both are window globals — no import.</li><li>Add hero content (models, meshes, story motion) on top of the environment; do not delete group <code>__dreambyteEnvRoot</code>.</li><li>Prefer <code>MeshStandardMaterial</code> / <code>MeshPhysicalMaterial</code>; use <code>setupEnvironment(scene, renderer)</code> for PBR reflections when the scene is studio-like and you are not using a conflicting full-sky env.</li></ul>\n<h2>When to Use Three.js</h2>\n<ul><li>3D product showcases, architectural walkthroughs</li><li>Data scatter plots in 3D space</li><li>Particle systems with GPU acceleration</li><li>Immersive environments and camera flyovers</li><li>WebGL shader effects</li></ul>\n<h2>Gotchas</h2>\n<ul><li>NEVER use CapsuleGeometry (not available in r183)</li><li>Always set <code>window.__threeCamera</code> for editor integration</li><li>Don't delete <code>__dreambyteEnvRoot</code> group when using environments</li></ul>"},{"section":"Bundle docs","id":"SKILL","title":"Dreambyte Domain Skill","type":"guide","tags":["guide"],"html":"<h1>Dreambyte Scene Generator</h1>\n<p>You generate animated scene HTML files for the Dreambyte video editor.</p>\n<p>Scenes are self-contained HTML files served by the desktop app at <code>dreambyte://scenes/{id}.html</code>. The renderer + the MCP server both run inside the Dreambyte desktop app — there is no HTTP server, no <code>localhost:3000</code>, no Next.js API. All mutations go through MCP tools (registered in this session) which keep DB + HTML on disk in sync.</p>\n<hr>\n<h2>If the app is not running</h2>\n<p>If any tool call returns an error containing \"Dreambyte is not running\", stop immediately. Do NOT retry. Tell the user:</p>\n<blockquote>The Dreambyte desktop app is not running. Open it and let it fully load, then try again.</blockquote>\n<p>The in-app MCP tools (mutations, generation, narration, etc.) require the running app. For browsing or git-ing a saved project from outside the app, use the <strong>Tier 2 MCP server</strong> instead — see the next section.</p>\n<hr>\n<h2>Two MCP servers — pick the one that matches the task</h2>\n<p>Dreambyte ships two MCP servers. Both speak the same protocol; their scope differs.</p>\n<h3>In-app server (default)</h3>\n<p>Runs inside the desktop app. Exposes the agent's tools that mutate state — create projects and scenes, edit layers, generate narration, regenerate code, write HTML. This is what every section below assumes.</p>\n<h3>Tier 2 read-only server (no app needed)</h3>\n<p>Standalone stdio MCP server scoped to a single <code>.dreambyte/</code> folder. Reads the file mirror the app writes on save. Useful for: project audits, git-based review, building scene tooling outside the editor. Five tools:</p>\n<table><thead><tr><th>Tool</th><th>Returns</th></tr></thead><tbody><tr><td><code>tier2_read_project</code></td><td>parsed <code>project.json</code></td></tr><tr><td><code>tier2_list_scenes</code></td><td>one summary per scene (id/name/duration/type)</td></tr><tr><td><code>tier2_read_scene</code></td><td>parsed <code>dreambyte.json</code> for one scene</td></tr><tr><td><code>tier2_read_scene_html</code></td><td>rendered scene HTML if it exists; null else</td></tr><tr><td><code>tier2_list_assets</code></td><td>files under <code>assets/</code> with subpath + size</td></tr></tbody></table>\n<p>Register once per project folder:</p>\n<pre><code>claude mcp add dreambyte-tier2 -- npx tsx scripts/mcp/mcp-tier2-server.ts /path/to/project.dreambyte</code></pre>\n<p>The path-containment guard rejects symlinks, <code>..</code> traversal, absolute paths, and null-byte tricks; you cannot escape the <code>.dreambyte/</code> root by construction. Read-only by design — write-back goes through the in-app server when the user reopens the project.</p>\n<hr>\n<h2>Runtime model</h2>\n<ul><li><strong>You are inside the desktop app.</strong> The active project is already loaded — <code>select_project</code> switches between projects. Use <code>create_project</code> to create a new empty project (it auto-switches to it). For any showcase, test, or \"new video\" request, create a fresh project first rather than adding scenes to an existing one.</li><li><strong>All state-changing operations are MCP tools.</strong> There are no REST endpoints; the table below maps the HTTP calls you might reach for to the matching tool.</li><li><strong>Scenes render on the timeline automatically</strong> as soon as a tool call returns. Don't tell the user to \"open the app\" or paste a URL — they're already looking at the timeline.</li></ul>\n<table><thead><tr><th>Conceptual REST call</th><th>Use this tool instead</th></tr></thead><tbody><tr><td><code>POST /api/projects</code></td><td><code>create_project</code> — creates and auto-switches to a new project</td></tr><tr><td><code>POST /api/scene</code></td><td><code>write_scene_code</code> (create scene) / <code>add_layer</code> (add to existing)</td></tr><tr><td><code>PATCH /api/scene</code></td><td><code>patch_layer_code</code>, <code>regenerate_layer</code>, <code>scene_props</code></td></tr><tr><td><code>GET /api/scene?projectId=…</code></td><td>World state in your context already lists scenes; <code>inspect (kind:'scene')</code> to refresh</td></tr><tr><td><code>POST /api/tts</code></td><td><code>add_narration</code></td></tr><tr><td><code>POST /api/sfx</code></td><td><code>add_sfx</code> / <code>add_music</code></td></tr><tr><td><code>POST /api/charts</code></td><td><code>chart</code></td></tr></tbody></table>\n<p>If a tool you need isn't in the registered list for this run, surface that to the user instead of falling back to HTTP — there is no HTTP fallback.</p>\n<h3>Goal → Tool decision table</h3>\n<table><thead><tr><th>Goal</th><th>Tool</th></tr></thead><tbody><tr><td>Create a new scene from scratch</td><td><code>write_scene_code</code></td></tr><tr><td>Add a layer to an existing scene</td><td><code>add_layer</code></td></tr><tr><td>Edit an existing layer</td><td><code>patch_layer_code</code></td></tr><tr><td>Regenerate a layer with a new prompt</td><td><code>regenerate_layer</code></td></tr><tr><td>Add narration (TTS)</td><td><code>add_narration</code></td></tr><tr><td>Add avatar narration (HeyGen)</td><td><code>generate_avatar_narration</code></td></tr><tr><td>Generate an avatar scene</td><td><code>generate_avatar_scene</code></td></tr><tr><td>Generate a data chart</td><td><code>chart</code></td></tr><tr><td>Add a sound effect</td><td><code>add_sfx</code></td></tr><tr><td>Add background music</td><td><code>add_music</code></td></tr><tr><td>Generate an image from a reference</td><td><code>generate_image({ source:'reference' })</code></td></tr><tr><td>Create a variation of an existing asset</td><td><code>generate_image (source:'regenerate')</code></td></tr><tr><td>Regenerate a broken asset</td><td><code>generate_image({ source:'regenerate' })</code></td></tr><tr><td>Check a scene is rendering correctly</td><td><code>verify_scene</code></td></tr><tr><td>List scenes in the project</td><td><code>inspect (kind:'scene')</code></td></tr><tr><td>Read full scene data (with code)</td><td><code>inspect (kind:'code')</code></td></tr><tr><td>Get full project state + scene summaries</td><td><code>get_world_state</code></td></tr><tr><td>Create a brand-new project</td><td><code>create_project</code></td></tr><tr><td>Switch active project</td><td><code>select_project</code></td></tr><tr><td>Refresh project state after UI changes</td><td><code>refresh_state</code></td></tr><tr><td>Reorder scenes on the timeline</td><td><code>reorder_scenes</code></td></tr><tr><td>Delete a scene</td><td><code>delete_scene</code></td></tr><tr><td>Plan a full multi-scene video</td><td><code>plan_scenes</code></td></tr></tbody></table>\n<hr>\n<h2>Planning (output before generating scenes)</h2>\n<p>Before generating any scenes, output a <code>&lt;planning&gt;</code> block:</p>\n<pre><code>&lt;planning&gt;\nTopic: [what this explains]\nAudience: [who this is for, if inferable]\nScene count: [N] — [why this many, not more or fewer]\nRenderer choices:\n  - Scene 1 \"[name]\": [type] — [one sentence why this type]\n  - Scene 2 \"[name]\": [type] — [one sentence why]\n  ...\nNarrative arc: [how scenes build on each other]\nDuration rationale: [why these durations]\nWhat I'm NOT doing: [notable alternatives considered and rejected]\n&lt;/planning&gt;</code></pre>\n<p>Then generate scenes. The planning block is shown to the user so they can understand and redirect your choices before you do the work.</p>\n<hr>\n<h2>Parse the user prompt</h2>\n<p>Determine:</p>\n<ul><li><strong>How many scenes</strong> (default: 1; \"video about X\" implies 3–5 scenes)</li><li><strong>Scene type</strong> for each — see selection guide below</li><li><strong>Narrative arc</strong> if multi-scene: opening → development → conclusion</li><li><strong>Duration</strong> per scene (default: 8s)</li><li><strong>Background color</strong> per scene (default: <code>#181818</code>)</li></ul>\n<hr>\n<h2>Aspect Ratio</h2>\n<p>Projects support multiple aspect ratios: 16:9 (landscape), 9:16 (vertical), 1:1 (square), 4:5 (portrait). The scene template injects <code>WIDTH</code> and <code>HEIGHT</code> JS globals matching the project's dimensions. Always use these globals instead of hardcoding 1920/1080.</p>\n<p>Use <code>resolveProjectDimensions(aspectRatio, resolution)</code> from <code>src/lib/dimensions.ts</code> to get pixel dimensions.</p>\n<hr>\n<h2>Scene type: always <code>react</code></h2>\n<p>Every scene uses <code>\"type\": \"react\"</code>. The React component composes whatever renderers the content needs via bridge components:</p>\n<table><thead><tr><th>Content type</th><th>How to build it</th></tr></thead><tbody><tr><td><strong>Typography, layouts, cards, steps</strong></td><td>Pure JSX + <code>interpolate()</code> + <code>spring()</code> — no bridge needed</td></tr><tr><td><strong>3D geometry, product viz, text</strong></td><td><code>&lt;ThreeJSLayer&gt;</code> bridge — meshes, CSG booleans, 3D text, post-processing</td></tr><tr><td><strong>Hand-drawn, particles, procedural</strong></td><td><code>&lt;Canvas2DLayer&gt;</code> bridge</td></tr><tr><td><strong>Charts, data viz</strong></td><td><code>&lt;D3Layer&gt;</code> bridge, or <code>chart</code> MCP tool for standard charts</td></tr><tr><td><strong>Vector draw-on</strong></td><td><code>&lt;SVGLayer&gt;</code> bridge</td></tr><tr><td><strong>Micro-animations, icons</strong></td><td><code>&lt;LottieLayer&gt;</code> bridge</td></tr><tr><td><strong>Combined</strong></td><td>Stack multiple bridges in one scene with <code>&lt;AbsoluteFill&gt;</code> + <code>&lt;Sequence&gt;</code></td></tr></tbody></table>\n<p>The power of React: one scene can have a Three.js background, HTML text overlay, Canvas2D particles, and a D3 chart — all composed in JSX.</p>\n<h3>Three.js capabilities (via <code>&lt;ThreeJSLayer&gt;</code> — ALWAYS use React scenes for 3D)</h3>\n<p><strong>Default approach:</strong> <code>type: 'react'</code> with <code>&lt;ThreeJSLayer&gt;</code> for 3D background + JSX for text overlays. Call <code>buildInfiniteStudio(THREE, scene, camera, renderer, opts)</code> inside the ThreeJSLayer setup callback to get a full studio environment (sky sphere, infinite grid, floor, lighting, env map). Pass <code>{ color: 'white' }</code> (default), <code>{ color: 'dark' }</code>, <code>{ color: 'midnight' }</code>, or any hex string <code>{ color: '#rrggbb' }</code> to choose the environment. Use <code>makeStudioSet(THREE, scene, [x, y, z])</code> to build named sub-environments at world positions. Text/info goes in <code>&lt;AbsoluteFill&gt;</code> JSX overlays with <code>interpolate()</code> for entrance animations.</p>\n<p><strong>Scenes longer than 5 seconds must use at least 2 studio sets with a camera journey between them.</strong> Use <code>buildSceneSequencer(namedSets)</code> to orchestrate cuts and moves; call <code>sequencer.update(t, camera)</code> each frame.</p>\n<p>Three.js r183. Full toolkit available:</p>\n<ul><li><strong>3D text</strong>: <code>troika-three-text</code> — SDF text with any Google Font, outlines, curved text, PBR materials</li><li><strong>CSG booleans</strong>: <code>three-bvh-csg</code> — subtract/union/intersect meshes (holes, cutouts, complex shapes)</li><li><strong>Materials</strong>: 12 presets: <code>plastic, metal, glass, matte, glow, clearcoat, iridescent, velvet</code> (PBR) + <code>hologram, xray, pulse, fresnel</code> (shader) + full MeshPhysicalMaterial. Call <code>updateShaderMaterials(scene, t)</code> each frame when using shader presets.</li><li><strong>Post-processing</strong>: EffectComposer with bloom, depth of field (BokehPass), SSAO, anti-aliasing (SMAAPass)</li><li><strong>Lighting</strong>: studio 3-point, cinematic RectAreaLight, sunset, dramatic, neon — plus environment maps</li><li><strong>Camera</strong>: <code>StudioCamera.follow(t, keyframes, cam?)</code> for path animation; <code>StudioCamera.fitTo(mesh, opts, controls)</code> for geometry-aware auto-framing; <code>StudioCamera.autoFrame(mesh, camera, opts)</code> for instant fit; <code>buildCameraControls(camera, renderer, opts)</code> wraps camera-controls for interactive preview (set <code>interactive: false</code> for video export).</li><li><strong>Camera presets</strong>: <code>CAMERA_PRESETS.productReveal(t, opts, cam)</code>, <code>cinematicSweep</code>, <code>heroDescend</code>, <code>pushIn</code>, <code>rackFocusReveal</code> — pass <code>t</code> for scrub-safe output.</li><li><strong>Particles</strong>: <code>buildParticleField(THREE, scene, opts)</code> — ambient drift; <code>buildParticles(THREE, scene, opts)</code> — shaped emitters (sphere/ring/cone/box); <code>buildDataParticles(THREE, scene, points, opts)</code> — data-driven convergence. All expose <code>.update(t)</code> for scrub-safe animation.</li><li><strong>Animated connections</strong>: <code>buildConnectionLine(THREE, scene, pointA, pointB, opts)</code> — tube with <code>.drawOn(t, dur)</code> for partial draw animation.</li><li><strong>Scene sequencer</strong>: <code>buildSceneSequencer(namedSets)</code> — <code>.cut(t, setName)</code>, <code>.move(startT, endT, fromSet, toSet)</code>, <code>.update(t, camera)</code>. Mirrors After Effects multi-comp workflow.</li><li><strong>Models</strong>: GLTFLoader + DRACOLoader for compressed .glb, AnimationMixer for animated .glb clips</li><li><strong>Effects</strong>: Sparkles, Grid, Stars from <code>@pmndrs/vanilla</code></li><li><strong>Model library</strong>: CC0 GLB models (search via <code>find_media (kind:'3d')</code> tool)</li></ul>\n<p>Read <code>.claude/skills/dreambyte/rules/three.md</code> for full patterns, AE-quality templates, and code examples.</p>\n<p>Physics parameter hygiene (to prevent framing/position glitches):</p>\n<ul><li>Prefer angles in degrees in prompts/tool args (e.g. 35, 45, 60). Runtime normalizes units.</li><li>Start with stable parameter ranges before edge-case extremes.</li><li>Harmonic oscillator <code>x0</code>/<code>v0</code>: use either sim units (<code>0.5-4</code>) or pixel-like (<code>60-240</code>) — both are normalized.</li></ul>\n<hr>\n<h2>Planning scenes</h2>\n<p>Before writing any code, plan the full set of scenes:</p>\n<ul><li>List each scene with: name, type, duration, background color, visual concept</li><li>Describe the narrative arc</li><li>Confirm the plan reads as a coherent video</li></ul>\n<p><strong>Duration calculation:</strong> For each scene, count all visible text elements (titles, labels, steps, annotations, captions). Calculate: <code>duration = max(6, (totalWords / 2.5) + 3)</code></p>\n<p>Examples:</p>\n<ul><li>Title + subtitle + 1 sentence = ~15 words → max(6, 15/2.5 + 3) = 9s</li><li>4 step-by-step lines + title = ~40 words → max(6, 40/2.5 + 3) = 19s → cap at 18s</li><li>Diagram with 8 labels + title = ~25 words → max(6, 25/2.5 + 3) = 13s</li></ul>\n<p>Scenes should never feel rushed. The viewer needs time to read everything AND understand the visual.</p>\n<hr>\n<h2>Technical craft — pull on demand (<code>get_routed_craft</code>)</h2>\n<p>For the how-to references THIS video needs, call <strong><code>get_routed_craft({ pack })</code></strong> — the <code>pack</code> enum lists every pack that exists: <code>audio</code> (mix), <code>generation</code> (scene output contract + AI image/video/avatar generation), <code>research</code> (media sourcing), and <code>three</code> (Studio3D SDK). Omit <code>pack</code> to get everything routed by the project's stored brief at once.</p>\n<p>These are technical references (API, audio mix, media sourcing) — pull the one whose trigger applies. Aesthetic decisions (composition, color, motion, structure) are yours; there is no taste rulebook. The packs also live as markdown under <code>.claude/skills/dreambyte/rules/</code> (listed in the bundle-root <code>index.md</code>) if you want to read them directly.</p>\n<p><strong>Set the aspect ratio first if it isn't landscape.</strong> If the video is vertical (TikTok / Reel / Short → <code>9:16</code>), square (<code>1:1</code>), or portrait (<code>4:5</code>), call <strong><code>set_aspect_ratio</code></strong> with that ratio <strong>before building any scenes</strong> — otherwise the project stays 16:9 and your \"vertical\" scenes render letterboxed. The brief tells you the format; make it real with this call.</p>\n<h2>Generating code</h2>\n<p><strong>React is the default renderer.</strong> Read these files before generating any scene code:</p>\n<ol><li><code>docs/DESIGN.md</code> (project root) — <strong>TOKENS FIRST</strong>: read the YAML frontmatter for exact color hex values, type sizes, spacing values, and named layout patterns. These are the values to use — not approximations, not inventions.</li></ol>\n<p>The scene contract (structure, bridge components, animation API, duration/safe-area rules) is in this file, below — there is no separate renderer rule pack to read.</p>\n<p><code>docs/DESIGN.md</code> tokens override any defaults you'd otherwise reach for. If docs/DESIGN.md says <code>scene-bg-dark: \"#0c0c0e\"</code>, use <code>#0c0c0e</code>, not <code>#181818</code> or <code>#0a0a0a</code>. If docs/DESIGN.md says the layout pattern is <code>stat-anchor</code>, implement it exactly as described in the Components section.</p>\n<p>Every scene is a React component. Use bridge components (<code>ThreeJSLayer</code>, <code>Canvas2DLayer</code>, <code>D3Layer</code>, <code>SVGLayer</code>, <code>LottieLayer</code>) to compose multiple renderers in one scene.</p>\n<p><strong>D3 charts: use <code>chart</code> MCP tool</strong> for standard chart types (bar, line, pie, etc.). Zero LLM tokens, consistent animation. Only write custom D3 via <code>&lt;D3Layer&gt;</code> bridge for exotic visualizations.</p>\n<p><code>rules/three.md</code> is the only renderer pack — it carries the Studio3D SDK API for <code>&lt;ThreeJSLayer&gt;</code>. The other renderers' APIs are in this file and in <code>src/lib/skills/library/</code>.</p>\n<p>Apply every rule in the relevant files. The rules are not suggestions.</p>\n<hr>\n<h2>Scene IDs</h2>\n<p>Do NOT set a custom id when creating scenes. Omit <code>sceneId</code> in <code>write_scene_code</code> and the tool generates one. The <code>name</code> field is the human-readable label shown in the app timeline. Use descriptive names like \"Title Card\", \"Visual Proof\", \"Practice Problem 1\".</p>\n<hr>\n<h2>After generating code</h2>\n<p>Persist each scene with <code>write_scene_code</code> so it appears in the timeline and database:</p>\n<pre><code>write_scene_code({\n  name: \"Scene Name\",\n  sceneType: \"react\",\n  sceneCode: \"&lt;JSX code&gt;\",\n  styles: \"&lt;optional CSS&gt;\",\n  duration: 8,\n  bgColor: \"#0a0c10\"\n})</code></pre>\n<p><code>generatedCode</code> for React scenes carries <code>sceneCode</code> (JSX) and optional <code>styles</code> (CSS). The tool writes the scene to the project database, regenerates the HTML on disk, and the timeline picks it up — no manual file write, no API call.</p>\n<p>For <strong>structured D3 charts</strong> use <code>chart</code> instead of writing D3 by hand.</p>\n<hr>\n<h2>Adding narration (TTS)</h2>\n<p>Use <code>add_narration</code> — one tool call generates the audio, attaches it to the scene's <code>audioLayer.tts</code>, and (when needed) extends the scene's duration so the narration fits:</p>\n<pre><code>add_narration({\n  sceneId: \"&lt;sceneId&gt;\",\n  text: \"Narration text here\",\n  // Optional: provider / voiceId / instructions if the user picks them\n})</code></pre>\n<p>The tool selects an enabled TTS provider, writes the audio file to <code>dreambyte://audio/tts-*.mp3</code>, and updates the scene atomically. Don't call sub-steps yourself.</p>\n<p>Sizing rule: scene duration should be <code>ceil(narrationDuration + 1)</code> so the visual has a beat after the voice ends. <code>add_narration</code> handles this; if you change duration manually afterwards, use <code>scene_props</code>.</p>\n<p><strong>Sequential mutations:</strong> scene-level tool calls on the same project must be sequential (not parallel) — they share the project JSON blob.</p>\n<hr>\n<h2>Editing existing scenes</h2>\n<ol><li>The world state in your context lists scenes with their layers — start there. Call <code>inspect (kind:'scene')</code> only if you need a refresh.</li><li>Pick the layer to change (each has id, type, label, prompt).</li><li>Apply the edit:</li></ol>\n<ul><li>Whole-layer code rewrite → <code>regenerate_layer</code> (or <code>write_scene_code</code> with the <code>sceneId</code>)</li><li>Targeted patch (string substitution / surgical edit) → <code>patch_layer_code</code></li><li>Scene-level fields (duration, background, transition) → <code>scene_props</code></li></ul>\n<ol><li>Call <code>verify_scene</code> afterward to catch render issues before declaring success.</li></ol>\n<p>The tools update the project database and regenerate the HTML on disk atomically. NEVER edit <code>public/scenes/<em>.html</code> or any <code>dreambyte://scenes/</em>.html</code> file directly — those are generated outputs.</p>\n<p>For D3 scenes with DreambyteCharts:</p>\n<ul><li>Prefer <code>chart</code> for standard chart types.</li><li>Multiple charts in one scene are supported and should remain as structured chart layers (<code>scene.chartLayers</code>).</li><li>Keep chart defaults readable (title/labels/grid/legend/legible font) unless user explicitly requests a different visual style.</li></ul>\n<hr>\n<h2>MCP Tools (optional, powerful)</h2>\n<p>If the Dreambyte MCP server is connected (<code>dreambyte</code> in settings), you have access to the agent tools directly — the same tools the in-app agent uses. Key tools:</p>\n<table><thead><tr><th>Tool</th><th>What it does</th></tr></thead><tbody><tr><td><code>verify_scene</code></td><td>Static analysis: checks content, text overlap, palette, audio, duration</td></tr><tr><td><code>plan_scenes</code></td><td>Generate a storyboard before building scenes</td></tr><tr><td><code>add_narration</code></td><td>Add TTS narration (auto-selects provider)</td></tr><tr><td><code>add_sfx</code></td><td>Search and attach sound effects</td></tr><tr><td><code>add_music</code></td><td>Search and attach background music</td></tr><tr><td><code>chart</code></td><td>Create animated D3 chart (zero LLM cost)</td></tr><tr><td><code>scene_props</code></td><td>Set a scene's duration, background colour, or transition</td></tr><tr><td><code>set_style</code></td><td>Set palette, font, preset across all scenes</td></tr><tr><td><code>interaction</code></td><td>Add overlay interactivity (hotspot, choice, quiz, gate, tooltip, form, slider, toggle)</td></tr><tr><td><code>define_scene_variable</code></td><td>Define a typed variable on a scene (for slider/toggle/useVariable binding)</td></tr><tr><td><code>connect_scenes</code></td><td>Create scene graph edges with variable conditions for branching</td></tr><tr><td><code>select_project</code></td><td>Switch between projects</td></tr><tr><td><code>inspect (kind:'scene')</code></td><td>List all scenes in current project</td></tr><tr><td><code>generate_avatar_narration</code></td><td>Add talking avatar PIP overlay to a scene (auto-selects provider)</td></tr><tr><td><code>generate_avatar_scene</code></td><td>Create full presenter scene with avatar, panels, gestures</td></tr></tbody></table>\n<p>Avatar tools require an avatar provider configured in project settings (Settings &gt; Media Gen). See <code>.claude/skills/dreambyte/rules/generation.md</code> for detailed usage, moods, gestures, and placement rules.</p>\n<p><strong>Tool selection at a glance:</strong></p>\n<ul><li>Scene code: <code>write_scene_code</code>, <code>add_layer</code>, <code>regenerate_layer</code>, <code>patch_layer_code</code></li><li>Verification (always after a code mutation): <code>verify_scene</code></li><li>Audio: <code>add_narration</code>, <code>add_sfx</code>, <code>add_music</code></li><li>Data viz: <code>chart</code> (preferred for standard charts)</li><li>Interactivity: <code>interaction</code>, <code>define_scene_variable</code>, <code>connect_scenes</code></li><li>Style/transitions: <code>set_style</code>, <code>scene_props</code></li></ul>\n<hr>\n<h2>Interactive video workflow</h2>\n<p>For interactive projects (<code>outputMode: 'interactive'</code>), scenes can respond to viewer input. The active project's <code>outputMode</code> is set when the user creates the project — if it's not interactive and they want it to be, ask them to change it in the editor or via a host-provided tool. Don't try to mutate <code>outputMode</code> mid-flow.</p>\n<h3>Step 1: Project must be in interactive mode</h3>\n<p>(set at project creation; not something this skill flips)</p>\n<h3>Step 2: Create scenes with useVariable/useInteraction hooks in code</h3>\n<p>Use the hooks in <code>generatedCode</code> (see <code>rules/generation.md</code> -&gt; \"Interactive scenes\"):</p>\n<ul><li><code>useVariable('rate', 5)</code> — reactive state synced with overlays</li><li><code>useInteraction('card')</code> — hover/click handlers</li><li><code>useTrigger('done')</code> — fire events to parent</li></ul>\n<h3>Step 3: Add variables + interactions</h3>\n<p>Define each variable first with <code>define_scene_variable</code>, then add every overlay for the scene in one <code>interaction</code> call — one entry per element in <code>items</code>, with type-specific fields in <code>config</code>:</p>\n<pre><code>define_scene_variable({ sceneId: \"...\", name: \"interestRate\", type: \"number\", defaultValue: 5 })\ndefine_scene_variable({ sceneId: \"...\", name: \"showComparison\", type: \"boolean\", defaultValue: false })\n\ninteraction({\n  sceneId: \"...\",\n  items: [\n    {\n      type: \"slider\",\n      x: 5, y: 80, width: 40, height: 8,\n      appearsAt: 1,\n      config: { label: \"Interest Rate\", min: 1, max: 15, step: 0.5, defaultValue: 5,\n                setsVariable: \"interestRate\", showValue: true, unit: \"%\" }\n    },\n    {\n      type: \"toggle\",\n      x: 5, y: 90, width: 40, height: 6,\n      appearsAt: 2,\n      config: { label: \"Show Comparison\", defaultValue: false, setsVariable: \"showComparison\",\n                onLabel: \"On\", offLabel: \"Off\" }\n    }\n  ]\n})</code></pre>\n<h3>Step 4: Add quiz/choice/hotspot overlays</h3>\n<p>All 8 interaction types use the same <code>interaction</code> tool — <code>type</code> selects the variant:</p>\n<table><thead><tr><th>Type</th><th>Key <code>config</code> fields</th><th>Use case</th></tr></thead><tbody><tr><td><code>hotspot</code></td><td>label, shape, color, jumpsToSceneId</td><td>Clickable regions on diagrams</td></tr><tr><td><code>choice</code></td><td>question, options[{label, jumpsToSceneId}]</td><td>Branching decisions</td></tr><tr><td><code>quiz</code></td><td>question, options[], correctOptionId, explanation</td><td>Knowledge checks</td></tr><tr><td><code>gate</code></td><td>buttonLabel, minimumWatchTime</td><td>Progression blocker</td></tr><tr><td><code>tooltip</code></td><td>triggerLabel, tooltipTitle, tooltipBody</td><td>Info overlays</td></tr><tr><td><code>form</code></td><td>fields[], setsVariables[], submitLabel</td><td>Data collection</td></tr><tr><td><code>slider</code></td><td>min, max, step, setsVariable, label</td><td>Numeric control</td></tr><tr><td><code>toggle</code></td><td>setsVariable, label, onLabel, offLabel</td><td>Boolean switch</td></tr></tbody></table>\n<h3>Step 5: Connect scenes with conditions</h3>\n<p>Use <code>connect_scenes</code> once per edge:</p>\n<pre><code>connect_scenes({ fromSceneId: \"&lt;s1&gt;\", toSceneId: \"&lt;s2&gt;\", conditionType: \"auto\" })\n\nconnect_scenes({\n  fromSceneId: \"&lt;s2&gt;\",\n  toSceneId: \"&lt;s3&gt;\",\n  conditionType: \"variable\",\n  variableCondition: { variableName: \"score\", operator: \"gte\", value: 80 }\n})</code></pre>\n<p>For hotspot/choice/quiz/gate edges, pass the triggering element's <code>interactionId</code>.</p>\n<p>Condition operators: <code>eq</code>, <code>neq</code>, <code>gt</code>, <code>lt</code>, <code>gte</code>, <code>lte</code>, <code>contains</code>, <code>truthy</code>, <code>falsy</code>.</p>\n<h3>Full workflow summary</h3>\n<ol><li>Project must already be <code>outputMode: 'interactive'</code> (set at creation, not flipped here).</li><li><code>write_scene_code</code> per scene (hooks in the scene code).</li><li><code>define_scene_variable</code> / <code>interaction</code> / <code>connect_scenes</code> to flesh out the interactivity layer.</li><li><code>verify_scene</code> after each mutation pass.</li><li>Scenes render on the editor timeline automatically — slider/toggle/quiz overlays stack on top.</li></ol>\n<p>See <code>rules/generation.md</code> -&gt; \"Interactive scenes\" for hook documentation and patterns.</p>\n<hr>\n<h2>After creating scenes</h2>\n<p>All scenes are parts of ONE video in the timeline. They play sequentially: scene 1 → 2 → 3 → ... → final.</p>\n<p>Keep the closing message short. The user is already in the desktop app — the scenes appear on their timeline the moment the tool calls complete. Don't tell them to \"open the app\", paste any URL, or reference <code>localhost</code> / <code>[app]</code>. None of those are real in this runtime.</p>\n<p>Good closer:</p>\n<pre><code>✅ {N} scenes created (~{total}s total)\n\nScenes in order:\n1. {name} ({type}, {n}s)\n2. {name} ({type}, {n}s)\n...</code></pre>\n<p>Do NOT paste individual scene URLs as the primary output. The timeline panel is the primary interface. Individual URLs are only useful for debugging.</p>"},{"section":"Bundle docs","id":"index","title":"index","type":"index","tags":[],"html":"<h1>Dreambyte Knowledge Bundle</h1>\n<p>OKF v0.1 conformant. Generated by <code>scripts/okf/gen-okf-viz.ts</code> — do not hand-edit the index files.</p>\n<h2>Craft packs</h2>\n<ul><li><a href=\"/rules/audio.md\">Audio Craft Rules</a> [core, audio] - How to wire audio tools — spine, mix dB targets, provider ladder. Read while planning, before any audio call.</li><li><a href=\"/rules/generation.md\">Scene Output Contract &amp; AI Generation Rules</a> [lane:avatar] - How to emit a valid scene (React output schema, globals, bridge components, hard DON'Ts) and how to generate avatars, AI images, and AI video clips.</li><li><a href=\"/rules/research.md\">Research &amp; Media Sourcing Rules</a> [lane:media] - Which tool sources each asset a scene needs — facts, footage, images, overlays, 3D textures — driven by brief.mediaStrategy.</li><li><a href=\"/rules/three.md\">Three.js Scene Rules (r183 + Studio3D SDK)</a> [renderer] - One pack for 3D — studio/lighting, camera, materials/shaders, particles/terrain, post-FX, 3D text, and avatars, plus the ThreeJSLayer bridge contract and export determinism.</li></ul>\n<ul><li>Skill library lives at <code>src/lib/skills/library/</code> (renderer skills; its own index.md).</li></ul>\n<h2>Routing tags</h2>\n<p>A craft <code>rule</code> carries <code>tags</code> that decide when it is injected (intent-router selects by tag intersection). This vocabulary is the bundle's routing contract — documented here so any consumer can route without reading the TS:</p>\n<ul><li><code>core</code> — routed for every video (audio).</li><li><code>lane:media</code> / <code>lane:avatar</code> — routed when the brief sources media / is avatar-centric.</li><li><code>renderer</code> — routable on demand via <code>get_routed_craft({ pack })</code>, not intent-routed.</li></ul>"}];
const ORDER = ["Craft rules","Renderer rules","Skill library","Bundle docs"];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
const tree=document.getElementById('tree'), q=document.getElementById('q'), docEl=document.getElementById('doc'), chipsEl=document.getElementById('chips'), main=document.getElementById('main');
let current=null;
function key(d){return d.section+'::'+d.id;}
function show(d){
  current=key(d);
  Array.prototype.forEach.call(document.querySelectorAll('.f'),function(e){e.classList.toggle('on',e.dataset.k===current);});
  chipsEl.innerHTML='<span class="chip type">'+esc(d.type)+'</span>'+d.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('');
  docEl.innerHTML=d.html;
  main.scrollTop=0;
}
function build(filter){
  tree.innerHTML='';
  ORDER.forEach(function(sec){
    const items=DOCS.filter(function(d){return d.section===sec&&(!filter||(d.title+' '+d.id).toLowerCase().indexOf(filter)>=0);});
    if(!items.length)return;
    const head=document.createElement('div');head.className='sec';head.textContent=sec;tree.appendChild(head);
    items.forEach(function(d){
      const a=document.createElement('div');a.className='f';a.dataset.k=key(d);
      a.innerHTML='<div>'+esc(d.title)+'</div><div class="meta">'+esc(d.id)+'.md</div>';
      if(key(d)===current)a.classList.add('on');
      a.addEventListener('click',function(){show(d);});
      tree.appendChild(a);
    });
  });
}
q.addEventListener('input',function(){build(q.value.trim().toLowerCase());});
build('');
show(DOCS.find(function(d){return d.section==='Craft rules';})||DOCS[0]);
</script></body></html>
