<style>
  :root{--bg:#0f1115;--panel:#13161c;--card:#171a21;--line:#2a2f3a;--ink:#e6e6e6;--mut:#8b95a7;--acc:#4ea1ff;}
  *{box-sizing:border-box} html,body{height:100%} body{margin:0;font:14px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex}

  #nav h1{font-size:14px;margin:2px 0 10px} #q{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;margin-bottom:12px;font-size:13px}
  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:14px 0 6px}
  .f{padding:6px 9px;border-radius:7px;color:var(--ink);cursor:pointer;font-size:13px}

  .f .meta{color:var(--mut);font-size:11px}
  #main{flex:1;height:100vh;overflow:auto;padding:28px 40px;min-width:0}
  .doc{max-width:820px}
  #chips{margin:0 0 18px} .chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 10px;font-size:11px;color:var(--mut);margin:0 6px 6px 0}
  .chip.type{color:#0f1115;background:var(--acc);border:none;font-weight:600}
  #doc{overflow-wrap:anywhere}
  #doc h1{font-size:25px;margin:.2em 0 .5em} #doc h2{font-size:19px;margin:1.4em 0 .4em;border-bottom:1px solid var(--line);padding-bottom:4px}
  #doc h3{font-size:16px;margin:1.2em 0 .3em;color:#cdd3df} #doc h4{font-size:14px;color:var(--mut);margin:1em 0 .2em}
  #doc p{margin:.6em 0} #doc ul,#doc ol{margin:.5em 0;padding-left:1.4em} #doc li{margin:.2em 0}
  #doc code{background:#0c0e13;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12.5px}
  #doc pre{background:#0c0e13;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;white-space:pre} #doc pre code{border:none;padding:0;background:none}
  #doc table{border-collapse:collapse;margin:.8em 0;font-size:13px} #doc th,#doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  #doc th{background:var(--card)} #doc blockquote{border-left:3px solid var(--acc);margin:.8em 0;padding:.2em 14px;color:var(--mut);background:#12141a;border-radius:0 8px 8px 0}
  #doc hr{border:none;border-top:1px solid var(--line);margin:1.4em 0} #doc a{color:var(--acc)} #doc strong{color:#fff}

<script>
const DOCS = [{"section":"Craft rules","id":"audio","title":"Audio Craft Rules","type":"rule","tags":["core","audio"],"html":"<h1>Audio Tools</h1>\n<p>Plan the audio spine alongside the visual plan. Do not bolt it on at the end.</p>\n<p>Tools: <code>add_narration</code>, <code>add_music</code>, <code>add_sfx</code>, <code>set_audio_mix</code>, <code>set_master_volume</code>, <code>clone_voice</code>, <code>dub_video</code>. <code>add_music</code> takes <code>source: 'library'|'generate'|'compose'</code>; <code>add_sfx</code> takes <code>source: 'library'|'synthesize'</code>.</p>\n<h2>Pick ONE spine before building</h2>\n<p>Tie to <code>brief.voiceDriver</code>. Do not stack competing leads.</p>\n<table><thead><tr><th>Spine</th><th><code>voiceDriver</code></th><th>When</th><th>Lead tool</th></tr></thead><tbody><tr><td>Narration-led</td><td><code>narration</code></td><td>Explainers, tutorials, teaching</td><td><code>add_narration</code> first; music ducks under</td></tr><tr><td>Music-led</td><td><code>music</code> or none</td><td>Montages, brand films, hype reels</td><td><code>add_music</code> first (source:compose/generate); cut to the beat</td></tr><tr><td>Diegetic-led</td><td><code>footage</code></td><td>Uploaded footage with real on-screen sound</td><td>Keep footage audio; add score only as a bed</td></tr></tbody></table>\n<h2>Mix — set dB via <code>set_audio_mix</code></h2>\n<p>Set explicit levels. Never leave balance to chance.</p>\n<table><thead><tr><th>Layer</th><th>Target</th></tr></thead><tbody><tr><td>Vocals / narration</td><td><strong>-9 to -12 dB</strong> — always intelligible, sits on top</td></tr><tr><td>Music under voice</td><td><strong>~-2 dB</strong> ducked below voice; bed drops ~12 dB when VO present</td></tr><tr><td>Music, no voice</td><td>Bring up to lead level to carry the moment</td></tr><tr><td>SFX</td><td>Supporting accents; never louder than VO</td></tr></tbody></table>\n<p>Gain ladder: voice ~1.0 &gt; music bed ~0.12 (≈−18 dB) under voice &gt; SFX ~0.35.</p>\n<ul><li>Voice always wins. Duck the bed under speech, lift it in the gaps.</li><li>Duck <strong>per narration line</strong>: down fast ~0.15s at the line start, back up ~0.4s in the gap. Not once for the whole track.</li><li>Anchor a build/riser to its payoff: trigger at <code>climax_time − riser_duration</code> so it PEAKS on the hit.</li><li><code>set_master_volume</code>: set final overall level once at the end for consistent export loudness.</li><li>Leave headroom. Peak just under clipping with voice on top; do not slam layers to 0 dB.</li></ul>\n<h2>Music — compose vs generate vs library vs upload</h2>\n<p>All music goes through <code>add_music({ source })</code>. Local-first: <code>source:'compose'</code> and the bundled library are $0 and controllable. Reach for them before paid generation.</p>\n<table><thead><tr><th><code>source</code></th><th>Use when</th></tr></thead><tbody><tr><td><code>compose</code></td><td>Structured/controllable music — mood, tempo, key, intensity, length matched to cut. Local, $0. Default for music-led.</td></tr><tr><td><code>generate</code></td><td>Fast full-texture track from a text <code>prompt</code>, no beat-level control. PAID (spend-gated). Good for beds.</td></tr><tr><td><code>library</code></td><td>A pre-cleared royalty-free bed already fits — search by <code>query</code>, fastest.</td></tr><tr><td>(upload)</td><td>User supplied a track / licensing must be exact — always prefer the user's own track.</td></tr></tbody></table>\n<p>Seat under the spine with <code>set_audio_mix</code>.</p>\n<p>Generative-music model ladder (when you call <code>add_music({ source:'generate' })</code>):</p>\n<table><thead><tr><th>Model</th><th>Cost</th><th>Reach for it when</th></tr></thead><tbody><tr><td><code>stable-audio</code> (FAL)</td><td>~5¢</td><td>cheapest generative bed</td></tr><tr><td><code>lyria</code> (Google)</td><td>~8¢</td><td>cheap, decent general-purpose</td></tr><tr><td><code>elevenlabs-music</code></td><td>~40¢</td><td>cleanest commercial licensing for shipped/branded video</td></tr><tr><td><code>musicgen</code> (local, opt-in)</td><td>$0</td><td>neural text-prompt bed, no API cost</td></tr></tbody></table>\n<h2>SFX</h2>\n<p>All SFX go through <code>add_sfx({ source })</code>. <code>source:'library'</code> for recorded clips (search by <code>query</code>); <code>source:'synthesize'</code> for procedural hits (ZzFX/jsfxr/nature/modal, $0, no key).</p>\n<p>Use for: transition markers (whoosh on a cut/transform), on-screen actions (click, pop, count tick, impact), diegetic realism on footage.</p>\n<p>Do not: give every element its own sound, sit SFX at voice level, loop/repeat mechanically.</p>\n<p>A handful of well-placed accents beats a wall of sound. Prefer <code>source:'synthesize'</code> for clean UI/abstract hits; <code>source:'library'</code> for organic real-world sounds.</p>\n<h2>Narration providers — <code>add_narration</code></h2>\n<p>Use the cheapest voice that clears the brief.</p>\n<table><thead><tr><th>Provider</th><th>Cost</th><th>Use when</th></tr></thead><tbody><tr><td>pocket-tts (local)</td><td>$0</td><td>Default. Local, fast, self-managed; pin <code>provider: 'pocket-tts'</code>.</td></tr><tr><td>gemini-tts / google-tts</td><td>~1¢</td><td>cheap cloud voice, step up from local</td></tr><tr><td>openai-tts</td><td>~2¢</td><td>style-instructable cloud voice</td></tr><tr><td>elevenlabs</td><td>~6¢</td><td>top-tier, expressive, broadcast-quality; shipped/hero VO</td></tr><tr><td>edge-tts / voxcpm (local) / web-speech</td><td>$0</td><td>free fallbacks when a provider key is missing</td></tr><tr><td>user-upload</td><td>—</td><td>user recorded their own VO — use as-is, don't regenerate</td></tr></tbody></table>\n<p>Write narration to be spoken: short sentences, natural cadence, room to breathe. After <code>add_narration</code>, duck the music bed via <code>set_audio_mix</code>.</p>\n<h2>Voice cloning &amp; dubbing</h2>\n<ul><li><code>clone_voice</code> — match narration to a provided voice (series consistency, or the user's own). User consent + source required.</li><li><code>dub_video</code> — replace/translate spoken audio in uploaded footage for another language. Keep diegetic ambience underneath where possible.</li></ul>\n<h2>Before finishing audio</h2>\n<ul><li>[ ] Spine chosen, consistent with <code>brief.voiceDriver</code>.</li><li>[ ] <code>set_audio_mix</code> applied: voice -9 to -12 dB, music ducked ~2 dB under voice, SFX supporting.</li><li>[ ] SFX are accents, not a wall — voice never buried.</li><li>[ ] <code>set_master_volume</code> calibrated once at the end.</li><li>[ ] Narration provider matches the brief's cost need.</li></ul>"},{"section":"Craft rules","id":"generation","title":"Scene Output Contract & AI Generation Rules","type":"rule","tags":["lane:avatar"],"html":"<h1>The React scene contract</h1>\n<p>Every scene is a React component. Compose HTML/CSS, Three.js, Canvas2D, D3, SVG, and Lottie in one component tree. Drive motion with <code>useCurrentFrame()</code> + <code>interpolate()</code>/<code>spring()</code>.</p>\n<h2>Output</h2>\n<p>Output raw JSON only — no markdown fences, no prose:</p>\n<pre><code>{\n  \"sceneCode\": \"function Scene() { ... }\\nexport default Scene;\",\n  \"styles\": \".custom-class { ... }\"\n}</code></pre>\n<ul><li><code>sceneCode</code> — full JSX component, transpiled in-browser via Babel. No imports; all APIs are globals.</li><li><code>styles</code> — optional CSS string, injected into a <code>&lt;style&gt;</code> block in <code>&lt;head&gt;</code>. No <code>&lt;style&gt;</code> tags. Use for <code>@keyframes</code> / complex selectors. Most scenes skip it — prefer inline <code>style={{}}</code>.</li></ul>\n<h2>APIs (globals — do NOT import)</h2>\n<h3>Hooks &amp; components</h3>\n<table><thead><tr><th>API</th><th>Purpose</th></tr></thead><tbody><tr><td><code>useCurrentFrame()</code></td><td>Integer frame number (0, 1, 2, …)</td></tr><tr><td><code>useVideoConfig()</code></td><td><code>{ fps, width, height, durationInFrames }</code></td></tr><tr><td><code>interpolate(value, inputRange, outputRange, opts?)</code></td><td>Map values between ranges</td></tr><tr><td><code>spring({ frame, fps, config?, from?, to? })</code></td><td>Spring-based easing</td></tr><tr><td><code>Easing.ease / .easeIn / .easeOut / .easeInOut / .bezier(x1,y1,x2,y2)</code></td><td>Easing for <code>interpolate</code></td></tr><tr><td><code>&lt;Sequence from={frame} durationInFrames={n}&gt;</code></td><td>Temporal composition — children see local frame from 0</td></tr><tr><td><code>&lt;AbsoluteFill style={{...}}&gt;</code></td><td>Full-frame (WIDTH×HEIGHT) absolute layer, stacks via z-index</td></tr><tr><td><code>useDreambyteSeek(cb)</code></td><td>Fire <code>cb(timeSec)</code> on every seek/scrub — for motion outside the master timeline (<code>window.__tl</code>)</td></tr><tr><td><code>useDreambyteTime()</code></td><td>Current scene time in seconds, synced with playback + scrub</td></tr></tbody></table>\n<h3>Bridge components</h3>\n<table><thead><tr><th>Component</th><th>Props</th><th>Use for</th></tr></thead><tbody><tr><td><code>&lt;Canvas2DLayer draw={(ctx, frame, config) =&gt; {}} /&gt;</code></td><td><code>width?</code>, <code>height?</code>, <code>style?</code></td><td>Hand-drawn strokes, particles, procedural art</td></tr><tr><td><code>&lt;ThreeJSLayer setup={(THREE, scene, camera, renderer) =&gt; {}} update={(scene, camera, frame, config) =&gt; {}} /&gt;</code></td><td><code>style?</code></td><td>3D geometry, PBR materials, shadows</td></tr><tr><td><code>&lt;D3Layer setup={(d3, el, config) =&gt; {}} update={(d3, el, frame, config) =&gt; {}} /&gt;</code></td><td><code>style?</code></td><td>Data visualization, charts</td></tr><tr><td><code>&lt;SVGLayer setup={(svgEl, anime, tl) =&gt; {}} viewBox?&gt;</code></td><td><code>children?</code>, <code>style?</code></td><td>Vector draw-on animations</td></tr><tr><td><code>&lt;LottieLayer data={lottieJSON} /&gt;</code></td><td><code>style?</code></td><td>Micro-animations, icons</td></tr></tbody></table>\n<h3>Scene globals (on <code>window</code>)</h3>\n<p><code>PALETTE</code>, <code>DURATION</code>, <code>FONT</code>, <code>BODY_FONT</code>, <code>STROKE_COLOR</code>, <code>WIDTH</code> (default 1920), <code>HEIGHT</code> (default 1080), <code>ROUGHNESS</code>, <code>SCENE_ID</code>. WIDTH/HEIGHT track the project aspect ratio (1080×1920 for 9:16, 1080×1080 for 1:1).</p>\n<p><code>FONT</code> = headings/display. <code>BODY_FONT</code> = body/labels (equals <code>FONT</code> when no pairing is active). Use both for contrast:</p>\n<pre><code>&lt;h1 style={{ fontFamily: FONT }}&gt;Title&lt;/h1&gt;\n&lt;p style={{ fontFamily: BODY_FONT }}&gt;Body text here&lt;/p&gt;</code></pre>\n<h2>Scene structure</h2>\n<pre><code>function Scene() {\n  const frame = useCurrentFrame();\n  const { fps, durationInFrames } = useVideoConfig();\n\n  React.useEffect(() =&gt; {\n    DreambyteCamera.kenBurns({ duration: DURATION, endScale: 1.04 });\n  }, []);\n\n  return (\n    &lt;AbsoluteFill style={{ background: '#0a0c10' }}&gt;\n      &lt;AbsoluteFill style={{ zIndex: 0 }}&gt;\n        &lt;ThreeJSLayer setup={...} update={...} /&gt;\n      &lt;/AbsoluteFill&gt;\n\n      &lt;Sequence from={15}&gt;\n        &lt;AbsoluteFill style={{ zIndex: 1, padding: '6% 7%' }}&gt;\n          &lt;Title frame={frame} /&gt;\n          &lt;FeatureList frame={frame} /&gt;\n        &lt;/AbsoluteFill&gt;\n      &lt;/Sequence&gt;\n\n      &lt;AbsoluteFill style={{ zIndex: 2, pointerEvents: 'none' }}&gt;\n        &lt;Canvas2DLayer draw={(ctx, f, cfg) =&gt; { /* particles */ }} /&gt;\n      &lt;/AbsoluteFill&gt;\n    &lt;/AbsoluteFill&gt;\n  );\n}\n\nexport default Scene;</code></pre>\n<ul><li>Stack layers with <code>&lt;AbsoluteFill&gt;</code> + <code>zIndex</code>; time them with <code>&lt;Sequence&gt;</code>.</li><li>End the file with <code>export default Scene;</code> (or <code>Main</code>, etc.). The bootstrapper reads <code>module.exports.default</code> (Babel <code>transform-modules-commonjs</code>). No export → blank iframe + console error, no crash, no fallback. Always write the export — do not rely on the auto-inject fallback.</li><li>Do NOT mount yourself. No <code>ReactDOM.createRoot()</code> / <code>.render()</code>. The bootstrapper wraps your component in <code>&lt;DreambyteComposition&gt;</code> and mounts it.</li></ul>\n<h2>Interactive scenes</h2>\n<p>For <strong>viewer-driven state</strong> (clicks, sliders, toggles). Animation state stays frame-based via <code>useCurrentFrame()</code>.</p>\n<p><code>useVariable(name, defaultValue)</code> — reactive state synced with the parent player via postMessage, persists across the session:</p>\n<pre><code>const [interestRate, setRate] = useVariable('interestRate', 5)\nconst monthlyPayment = (200000 * (interestRate / 100 / 12)) / (1 - Math.pow(1 + interestRate / 100 / 12, -360))</code></pre>\n<p>Declare with the <code>define_scene_variable</code> MCP tool, then <code>interaction</code> type <code>slider</code> to let the viewer drive it.</p>\n<p><code>useInteraction(elementId)</code> — returns <code>.handlers</code> props + <code>.isHovered</code>/click state for visual feedback:</p>\n<pre><code>const card = useInteraction('card-pricing')\n&lt;div {...card.handlers} style={{ transform: `scale(${card.isHovered ? 1.05 : 1})`, transition: 'all 200ms ease' }}&gt;Starter — $29/mo&lt;/div&gt;</code></pre>\n<p><code>useTrigger(name)</code> — one-shot events across the iframe boundary:</p>\n<pre><code>const milestone = useTrigger('completed-intro')\n// milestone.fire({ section: 'intro' })</code></pre>\n<p>In-scene hooks vs overlay:</p>\n<table><thead><tr><th>Scenario</th><th>Use</th></tr></thead><tbody><tr><td>Hoverable cards, charts, 3D objects</td><td><code>useInteraction</code> in scene</td></tr><tr><td>Slider that changes scene visuals</td><td><code>useVariable</code> in scene + slider overlay</td></tr><tr><td>Standard quiz, choice, gate</td><td>Overlay via <code>interaction</code></td></tr><tr><td>Toggle that shows/hides a layer</td><td><code>useVariable</code> + toggle overlay</td></tr></tbody></table>\n<p>Combine both: hoverable D3 bars (<code>useInteraction</code>) + overlay quiz (<code>interaction</code>).</p>\n<h2>Performance &amp; limits</h2>\n<ul><li>Max 1–2 ThreeJSLayers per scene — each opens a WebGL context (browsers allow 8–16 total). Compose multiple 3D objects into ONE setup.</li><li>D3Layer: wrap in <code>React.memo</code> or give a stable <code>key</code> — D3 mutates the DOM directly; prevents unexpected unmount.</li><li>Memoize components that don't use <code>useCurrentFrame()</code> — every frame re-renders the full tree.</li><li>Canvas2DLayer: fine to ~500 objects/frame; 1000+ needs simplifying/batching.</li></ul>\n<h2>Canvas bounds — WIDTH×HEIGHT</h2>\n<p>Scene renders inside a WIDTH×HEIGHT container (1920×1080 for 16:9; 1080×1920 for 9:16, 1080×1080 for 1:1, 1080×1350 for 4:5) with <code>overflow: hidden</code>. Content outside is clipped.</p>\n<ul><li>Use <code>&lt;AbsoluteFill&gt;</code>; do not exceed it.</li><li>Absolute coords within 0–WIDTH (x), 0–HEIGHT (y).</li><li>Keep important content within a 100px inset (100 to WIDTH−100, 100 to HEIGHT−100).</li><li>Too-tall content (long lists): fewer items, smaller fonts, multi-column, or split scenes.</li><li>Verify every element fits the box before finalizing.</li></ul>\n<h2>Do NOT</h2>\n<ul><li>No <code>requestAnimationFrame</code> — frames come from <code>useCurrentFrame()</code>.</li><li>No <code>useState</code> for animation state — derive from <code>frame</code>.</li><li>No <code>setTimeout</code> / <code>setInterval</code>.</li><li>No <code>Math.random()</code> — use frame-based deterministic values.</li><li>No importing React/ReactDOM — already global.</li><li>No <code>&lt;script&gt;</code> tags in JSX — all code in the component.</li><li>No manual mounting — <code>export default Scene;</code> only.</li><li>No bounce/elastic easing — use <code>Easing.bezier(0.16, 1, 0.3, 1)</code> for entrances.</li><li>No 2+ ThreeJSLayers in one scene — compose 3D into one layer.</li></ul>\n<hr>\n<h1>AI generation</h1>\n<p>Generate only when the subject is specific and not in stock, or must match the scene's exact palette/composition. Pick the cheapest model that clears the bar.</p>\n<h2>AI Images — <code>generate_image</code></h2>\n<table><thead><tr><th>The shot needs…</th><th>Model</th><th>Cost</th></tr></thead><tbody><tr><td>fast throwaway draft to check composition</td><td><code>flux-schnell</code></td><td>~0.3¢</td></tr><tr><td>photoreal / illustrated hero image (default)</td><td><code>flux-1.1-pro</code></td><td>~5¢</td></tr><tr><td>legible text in the image (logo, poster, UI, label)</td><td><code>ideogram-v3</code> or <code>nano-banana-pro</code></td><td>8¢ / 15¢</td></tr><tr><td>clean cut-out sticker / icon (transparent)</td><td><code>recraft-v3</code> (<code>generate_image({ mode:'sticker' })</code>)</td><td>~4¢</td></tr><tr><td>SAME character/subject across shots, or an edit</td><td><code>nano-banana</code> / <code>nano-banana-pro</code></td><td>4¢ / 15¢</td></tr><tr><td>match an uploaded/prior look</td><td><code>generate_image({ source:'reference' })</code></td><td>i2i rate</td></tr></tbody></table>\n<ul><li><code>source:'reference'</code> — feed a reference (user asset, research screenshot, earlier frame) so output inherits its look. Primary lever for style consistency.</li><li><code>source:'regenerate'</code> — re-roll for on-palette alternates (angle, crop, mood) or replace in place; preserves the timeline slot + timing.</li><li>Source at or above project resolution.</li><li>Pass a <code>seed</code> for reproducibility or clean variations.</li><li><code>imagen-3</code> is listed but not runnable — never route to it.</li></ul>\n<h2>AI Video — image-first</h2>\n<p>👍 Generate a still, approve the look, then i2v / camera move over it (cheaper, on-palette, controllable). 👎 Text-to-video, unless continuous motion of a non-existent subject is the whole point.</p>\n<table><thead><tr><th>The clip needs…</th><th>Model (via <code>generate_veo3_video({ provider })</code>)</th><th>Cost</th></tr></thead><tbody><tr><td>cheapest 5-8s motion</td><td><code>ltx</code></td><td>~6¢/s</td></tr><tr><td>top cinematic quality + native audio</td><td><code>veo3</code> / <code>veo31</code></td><td>$1+/s</td></tr><tr><td>realistic motion with start/end keyframe or extend</td><td><code>kling</code></td><td>~45¢ +9¢/s</td></tr><tr><td>edit/restyle/relight EXISTING footage (v2v)</td><td><code>runway</code> (Aleph)</td><td>~90¢ +18¢/s</td></tr></tbody></table>\n<ul><li><code>auto</code> routing defaults to the priciest (<code>veo3</code>) — name a cheaper <code>provider</code> explicitly when veo-grade cinema isn't required.</li></ul>\n<h2>Consistency — characters &amp; style refs</h2>\n<ul><li>Recurring person/creature/mascot: <code>character({ action:'create' })</code> ONCE (pins seed + reference image + style descriptor), then <code>character({ action:'render' })</code> per pose/scene. 👎 re-prompting the look from scratch (it drifts).</li><li>One coherent visual world: feed every generation the same reference via <code>generate_image({ source:'reference' })</code>; <code>source:'regenerate'</code> for on-palette alternates.</li><li>Stills take a camera move (Ken Burns push / perspective / parallax) rather than sitting dead on screen.</li></ul>\n<h2>Avatars</h2>\n<p>Default: no avatar. Add one only when the user asks. Ask if unsure.</p>\n<h3>Providers</h3>\n<p>Provider is set per-project in Settings &gt; Media Gen and auto-selected. Do NOT pass it in the tool call.</p>\n<table><thead><tr><th>Provider</th><th>Type</th><th>Cost</th><th>Notes</th></tr></thead><tbody><tr><td>musetalk</td><td>Photorealistic (FAL.ai)</td><td>~$0.04/scene</td><td>Requires source face image</td></tr><tr><td>fabric</td><td>Photorealistic (FAL.ai)</td><td>~$0.08-0.15</td><td>480p/720p, requires face image</td></tr><tr><td>aurora</td><td>Photorealistic (FAL.ai)</td><td>~$0.05/scene</td><td>Requires source face image</td></tr><tr><td>heygen</td><td>Premium API</td><td>~$0.10-1.00</td><td>HeyGen avatar library</td></tr></tbody></table>\n<h3>Which tool</h3>\n<table><thead><tr><th>Scenario</th><th>Tool</th></tr></thead><tbody><tr><td>Data viz / chart with narrator in corner</td><td><code>generate_avatar_narration</code></td></tr><tr><td>Animation with a presenter adding trust</td><td><code>generate_avatar_narration</code></td></tr><tr><td>Step-by-step tutorial led by a presenter</td><td><code>generate_avatar_scene</code></td></tr><tr><td>Corporate spokesperson delivering a message</td><td><code>generate_avatar_scene</code></td></tr><tr><td>Abstract concept scene, no person needed</td><td>No avatar</td></tr><tr><td>Data-heavy scene with complex visuals</td><td><code>generate_avatar_narration</code> (PIP) or no avatar</td></tr><tr><td>Scene under 5 seconds</td><td>No avatar</td></tr></tbody></table>\n<h3><code>generate_avatar_narration</code> — PIP overlay</h3>\n<p>Talking avatar as picture-in-picture on an existing scene. Use when the avatar supplements other content (charts, animations, diagrams).</p>\n<table><thead><tr><th>Parameter</th><th>Required</th><th>Description</th></tr></thead><tbody><tr><td>sceneId</td><td>yes</td><td>Target scene ID</td></tr><tr><td>text</td><td>yes</td><td>What the avatar says (natural, conversational)</td></tr><tr><td>placement</td><td>no</td><td><code>pip_bottom_right</code> (default), <code>pip_bottom_left</code>, <code>pip_top_right</code>, <code>fullscreen</code></td></tr><tr><td>avatarConfigId</td><td>no</td><td>Specific config ID (omit for project default)</td></tr><tr><td>sourceImageUrl</td><td>no</td><td>Face image URL (FAL providers only)</td></tr></tbody></table>\n<p>PIP avatars are true overlays. Scene uses the full viewport as normal.</p>\n<p>👍 Full-bleed scene, avatar as a small corner circle, partial overlap OK. 👎 Extra padding / <code>maxWidth</code> / reserved column to \"make room\" for the PIP.</p>\n<h3><code>generate_avatar_scene</code> — Full presenter scene</h3>\n<p>Avatar IS the main visual. Use for tutorials, walkthroughs, presenter, spokesperson. Uses a split layout: the provider's presenter video in a dedicated column, content panels beside it (unlike PIP).</p>\n<table><thead><tr><th>Parameter</th><th>Required</th><th>Description</th></tr></thead><tbody><tr><td>sceneId</td><td>yes</td><td>Target scene ID</td></tr><tr><td>narration_script</td><td>yes</td><td>Object: <code>{ mood, view, lines[], position }</code> — the spoken text is <code>lines[].text</code></td></tr><tr><td>content_panels</td><td>no</td><td>Array: <code>{ html, position, revealAt, exitAt }</code></td></tr><tr><td>backdrop</td><td>no</td><td>CSS background for the scene</td></tr><tr><td>avatar_position</td><td>no</td><td><code>left</code> (default), <code>right</code>, <code>center</code></td></tr><tr><td>avatar_size</td><td>no</td><td>% of viewport width (default 40)</td></tr><tr><td>avatar_config_id</td><td>no</td><td>Specific config (omit for project default)</td></tr></tbody></table>\n<pre><code>{\n  \"mood\": \"neutral\",\n  \"view\": \"upper\",\n  \"position\": \"fullscreen_left\",\n  \"lines\": [{ \"text\": \"Welcome to this tutorial!\" }, { \"text\": \"Let me show you the data.\" }]\n}</code></pre>\n<h3>Composition</h3>\n<p>Avatars composite as HTML overlays (<code>scene.aiLayers</code>), NOT React bridge components.</p>\n<ul><li>A React scene can use <code>&lt;ThreeJSLayer&gt;</code>, <code>&lt;Canvas2DLayer&gt;</code>, <code>&lt;D3Layer&gt;</code>, etc. alongside a PIP avatar.</li><li>Avatar renders on top as a separate HTML layer.</li><li>Avatar timing is TTS-driven (audio duration), independent of <code>useCurrentFrame()</code>.</li></ul>"},{"section":"Craft rules","id":"research","title":"Research & Media Sourcing Rules","type":"rule","tags":["lane:media"],"html":"<h1>Research &amp; Media Sourcing Rules</h1>\n<p>Code-drawn motion is the default. Source real media only when a scene needs the real thing (a real product, place, face, event) that the agent can't draw from code.</p>\n<p>Read <code>brief.mediaStrategy</code> before sourcing anything.</p>\n<h2>Pick one route per asset</h2>\n<p>Choose the cheapest route that clears the bar.</p>\n<table><thead><tr><th>Route</th><th>Use when</th><th>Tools</th></tr></thead><tbody><tr><td><strong>RESEARCH</strong></td><td>Facts, figures, names, dates, or a reference to design from</td><td><code>web_search</code>, <code>fetch_url_content</code></td></tr><tr><td><strong>STOCK</strong></td><td>Generic real-world footage/photos, no specific subject</td><td>`find_media({ kind:'video'\\</td><td>'image'\\</td><td>'archival' })`</td></tr><tr><td><strong>GENERATE</strong></td><td>Exact subject not in stock, or must match a style precisely</td><td><code>generate_image</code>, AI video — see the AI Generation rules</td></tr><tr><td><strong>USER</strong></td><td>The user already gave you the asset</td><td><code>media_library({ action:'query' })</code>, uploaded media in the project library</td></tr></tbody></table>\n<h3>RESEARCH — <code>web_search</code>, <code>fetch_url_content</code></h3>\n<ul><li>Any claim/stat/quote/date in the script → <code>web_search</code>, cite the source in planning notes. Never invent numbers.</li><li>Search to _see_ a real subject, then design or generate to match. The result image is a moodboard, not the final asset (licensing).</li><li><code>fetch_url_content</code> — full text of one source when snippets aren't enough (specs, primary doc, article to quote).</li></ul>\n<h3>STOCK — <code>find_media({ kind })</code></h3>\n<ul><li>Cheapest authentic route. Use for real-world texture with no fixed identity: city b-roll, nature, hands typing, crowds, abstract motion backgrounds.</li><li><code>kind:'archival'</code> — historical/documentary beats (period events, film grain, real news). Generation can't fake real history.</li><li>Make ONE broad search (12+ results) per subject and pick from it — near-identical repeat queries return the same material.</li><li>Prefer stock over generate when \"a coffee shop\" will do — 👍 stock coffee shop / 👎 generate one, it doesn't have to be _this_ coffee shop.</li><li>Check the returned license is clear before placing.</li></ul>\n<h3>USER assets</h3>\n<ul><li>User-supplied asset (logo, product photo, screen recording, headshot) wins over every generated/stock equivalent. Pull from project library / brand kit.</li><li>Highest-authenticity, zero-cost. Always check for one before sourcing or generating a substitute.</li></ul>\n<h2>Decision shortcuts</h2>\n<ul><li>Must be true (stat, date, real event) → RESEARCH, then cite.</li><li>Real but generic (b-roll, texture, mood) → STOCK.</li><li>Real and historical → <code>find_media({ kind:'archival' })</code>.</li><li>Specific and doesn't exist → GENERATE from a reference.</li><li>User already has it → USER asset.</li><li>Between stock and generate → stock first (cheaper, real, licensed).</li></ul>\n<h2>Overlays</h2>\n<h3>Captions — <code>add_captions</code></h3>\n<ul><li>Default-ON for any narrated/spoken scene (most viewers watch muted on mobile). Applies to talking, explainer, social content.</li><li>Legible weight, high contrast, safe-area placement (bottom third, inside the 80px inset). Match the project font. 👎 generic system font.</li></ul>\n<h3>Lower-thirds</h3>\n<ul><li>Names/titles/locations over footage. Keep in the scene's type system and palette.</li></ul>\n<h3>Stickers, SVGs, icons</h3>\n<ul><li>Use sparingly to label, point, or emphasize (arrows, circles, callout pills).</li><li>Adopt the scene's stroke color and motion personality. 👎 default-blue arrow on a graded photo.</li></ul>\n<h2>Fit sourced media to the project</h2>\n<ul><li>Color grade: <code>set_layer_props</code> grades one layer; <code>apply_color</code> grades the whole project. Use to reconcile mixed sources.</li><li>Framing: crop to project aspect ratio; <code>auto_reframe</code> converts a clip between aspect ratios.</li><li>Resolution: source at or above project resolution.</li><li>Stills: add a camera move (Ken Burns push / perspective / parallax) rather than holding a dead frame.</li></ul>\n<h2>3D textures &amp; assets — use the shipped SDK helpers</h2>\n<p>Three.js scenes run <code>WebGLRenderer</code> on r183. Everything below already ships in <code>public/sdk/dreambyte-studio3d.js</code> — call the helper, do NOT npm-install a texture library, and do NOT ship texture image files (storage + license risk).</p>\n<table><thead><tr><th>Need</th><th>Helper</th></tr></thead><tbody><tr><td>Video playing on a mesh (TV, phone, billboard, cinema)</td><td><code>buildVideoTexture</code></td></tr><tr><td>Animated GIF on a mesh</td><td><code>buildGifTexture</code></td></tr><tr><td>PBR surface — wood, brick, concrete, planet, dots, grid</td><td><code>buildProceduralMaterial</code></td></tr><tr><td>Logo/screenshot projected onto a 3D surface from an angle</td><td><code>buildProjectedMaterial</code></td></tr><tr><td>Brand reveal — texture shatters into instanced cubes</td><td><code>buildShatterReveal</code></td></tr><tr><td>Crisp 2D text labels / annotations / step numbers in 3D</td><td><code>buildLabel3D</code>, <code>buildSpriteAtlas</code></td></tr><tr><td>Many small textures → one atlas (cuts draw calls)</td><td><code>mergeTextures</code> / <code>mergeTexturesAsync</code></td></tr><tr><td>Sound localized to a mesh's world position</td><td><code>buildPositionalAudio</code> (3D), <code>buildPannedAudio</code> (2D L/R)</td></tr></tbody></table>\n<p><code>buildProceduralMaterial</code> kinds: <code>wood</code>, <code>bricks</code>, <code>concrete</code>, <code>polkaDots</code>, <code>grid</code>, <code>halftone</code>, <code>planet</code>, <code>gasGiant</code>. Zero bandwidth, all params are uniforms — animate them for reveals. If a scene needs a kind not in that list, pick the nearest one or draw the surface another way.</p>\n<h3>3D gotchas</h3>\n<ul><li><code>buildProjectedMaterial</code> bakes camera + mesh world matrices at project time. Projector camera moves after that ⇒ the projection drifts; re-project each frame (it's a uniform update, cheap).</li><li><code>buildLabel3D</code> sprites face the camera (correct for billboard text). For a label stuck flat on a surface, use a plane mesh with the same texture.</li><li>Atlas output is power-of-two and padded — budget ~1.5× the sum of inputs, and there's no dispose; don't atlas per-frame.</li><li><code>buildGifTexture</code> is not timeline-scrubbable. If the GIF must scrub, transcode to MP4/WebM and use <code>buildVideoTexture</code>.</li><li>Prefer WebM + <code>buildVideoTexture</code> over GIF generally — smaller and hardware-decoded.</li><li><code>tsl-textures</code> and other WebGPU/TSL libraries are NOT available — they need <code>three/webgpu</code>, which these scenes don't use. <code>buildProceduralMaterial</code> is the answer.</li></ul>\n<h2>Rules</h2>\n<ul><li>Read <code>brief.mediaStrategy</code> before sourcing; don't default to GENERATE.</li><li>Never state a fact you didn't verify with <code>web_search</code> / <code>fetch_url_content</code>.</li><li>Search results are moodboard — re-source or generate the final, licensed asset.</li><li>USER &gt; STOCK &gt; GENERATE on cost and authenticity.</li><li><code>find_media({ kind:'archival' })</code> for real history — never fake it with generation.</li><li><code>add_captions</code> ON for any narrated/spoken scene.</li><li>Every sourced asset: grade, crop to safe area, match the palette.</li><li>AI video only when motion of a non-existent subject is required; else still + camera move.</li></ul>"},{"section":"Renderer rules","id":"three","title":"Three.js Scene Rules (r183 + Studio3D SDK)","type":"rule","tags":["renderer"],"html":"<h1>Three.js Scene Rules (r183 + Studio3D SDK)</h1>\n<p>Standard three.js knowledge applies — only the Dreambyte-specific rules below matter. Every <code>build*</code> / <code>MATERIALS</code> / <code>StudioCamera</code> / <code>CAMERA_PRESETS</code> / <code>TEXT_EFFECTS</code> name is injected on <code>window</code> by the Studio3D SDK (<code>/sdk/dreambyte-studio3d.js</code>). <strong>Never import them.</strong></p>\n<h2>Hard rules</h2>\n<ul><li><strong>Build inside the bridge:</strong> <code>&lt;ThreeJSLayer setup={(THREE, scene, camera, renderer) =&gt; {}} update={(scene, camera, frame, config) =&gt; {}} /&gt;</code>. It owns the render loop and drives it frame-by-frame (scrub-safe). Never write your own canvas or WebGL loop.</li><li><strong>Never dynamically import three.js addons</strong> — <code>FontLoader</code>, <code>TextGeometry</code>, <code>SVGLoader</code>, <code>GLTFLoader</code>. They load a SECOND THREE beside the UMD <code>window.THREE</code> and the scene renders <strong>blank</strong>. Use the SDK text/SVG/avatar helpers, which call vendored classic-script versions sharing the UMD global.</li><li><strong>Determinism (export correctness):</strong> no <code>Math.random()</code>, no <code>Date.now()</code>, no <code>requestAnimationFrame</code>. Use the template-injected <code>mulberry32(seed)</code> — same seed, identical frames every pass. Every SDK helper here is deterministic at time <code>t</code>; the sole exception is <code>buildCameraControls(camera, renderer, { interactive: true })</code> (<code>window.CameraControls</code>), which is preview-only.</li><li><code>setup</code>/<code>update</code> are separate closures — stash refs on <code>window.__*</code> or <code>scene.userData</code>. <code>updateShaderMaterials(scene, t)</code> must run every frame or <code>MATERIALS.hologram/xray/pulse/fresnel</code> freeze.</li><li>Default to <code>buildInfiniteStudio(...)</code>. Over 5s, use ≥2 <code>makeStudioSet</code>s plus a camera journey — one rotating shape is the weakest 3D pattern.</li><li>No <code>MeshBasicMaterial</code>, no AmbientLight-only rigs, no hardcoded hex (use <code>PALETTE[]</code>). Subtitles and body copy go in an HTML <code>&lt;AbsoluteFill&gt;</code> overlay at <code>zIndex: 1</code>, never in 3D.</li></ul>\n<h2>The scaffold (<code>type: 'react'</code>)</h2>\n<pre><code>&lt;ThreeJSLayer\n  setup={(THREE, scene, camera, renderer) =&gt; {\n    const studio = buildInfiniteStudio(THREE, scene, camera, renderer)\n    window.__box = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), MATERIALS.metal(PALETTE[0]))\n    window.__box.position.y = studio.floorY + 1\n    window.__box.castShadow = true\n    scene.add(window.__box)\n    StudioCamera.setCamera(camera)\n    StudioCamera.park([0, 3, 12], [0, 0, 0])\n  }}\n  update={(scene, camera, frame, config) =&gt; {\n    const t = frame / config.fps\n    updateShaderMaterials(scene, t)\n    if (window.__box) window.__box.rotation.y = t * 0.4\n    StudioCamera.follow(t, [\n      { t: 0, pos: [0, 3, 12], lookAt: [0, 0, 0] },\n      { t: 7, pos: [6, 4, 8], lookAt: [0, 0, 0], ease: 'expo.out' },\n    ])\n  }}\n/&gt;</code></pre>\n<p>Legacy standalone <code>type: 'three'</code> scenes have no bridge: drive them from <code>window.__tl</code> (the master anime.js Timeline; seconds) with a proxy tween — <code>const s = { t: 0 }; window.__tl.add(s, { t: [0, DURATION], duration: DURATION, ease: 'linear', onUpdate: () =&gt; renderAt(s.t) }, 0)</code> — calling <code>renderer.render(scene, camera)</code> inside <code>renderAt</code> plus once up front for the paused frame (or subscribe with <code>window.__dreambyte.onTick((t) =&gt; renderAt(t))</code>). Never call play/pause on <code>__tl</code>.</p>\n<h2>Studio</h2>\n<p><code>buildInfiniteStudio(THREE, scene, camera, renderer, { color:'white'|'dark'|'midnight'|hex, gridColor, gridSpacing, floorY, fog, shadows, envIntensity })</code> → <code>{ floorY, lights:{ambient,key,fill,rim}, grid, setColor(), setLights() }</code>. Ships a 3-point rig + procedural IBL; <code>envIntensity: 0</code> kills reflections.</p>\n<p>Shadows need all four: <code>renderer.shadowMap.enabled</code> (studio sets it), <code>light.castShadow</code>, <code>mesh.castShadow</code>, <code>floor.receiveShadow</code>.</p>\n<h2>Camera</h2>\n<p><code>StudioCamera.*</code> take an optional trailing <code>cam</code> (defaults to <code>setCamera()</code>'s). Call in <code>update</code>; stateless.</p>\n<ul><li><code>setCamera(camera)</code>, <code>park(pos, lookAt)</code> — in <code>setup</code>.</li><li><strong><code>follow(t, [{ t, pos, lookAt, ease? }])</code> — PRIMARY for all camera motion.</strong> Hold = repeat a pos; <code>ease</code> applies INTO that keyframe.</li><li>Alternates: <code>orbit(t, opts)</code>, <code>dolly(t, duration, opts)</code>, <code>crane(t, opts)</code>, <code>spiralApproach(t, opts)</code>, <code>rackFocus(t, duration, cam, fromFOV, toFOV)</code>.</li><li><code>autoFrame(mesh, camera, { padding })</code> frames an object in <code>setup</code>, no distance guessing; <code>fitTo(mesh, { padding })</code> → <code>{ position, target }</code> for a <code>follow()</code> keyframe.</li></ul>\n<p>Easings: <code>linear</code>, <code>smooth</code>, <code>expo.out</code> (default), <code>expo.in</code>, <code>expo.inout</code>, <code>spring</code>, <code>bounce</code>.</p>\n<p><code>CAMERA_PRESETS.&lt;name&gt;(t, { target, duration, ...radius/dist/height pairs }, camera)</code>: <code>productReveal</code>, <code>cinematicSweep</code>, <code>heroDescend</code>, <code>pushIn</code>, <code>rackFocusReveal</code>.</p>\n<p><code>makeStudioSet(THREE, scene, [x,y,z])</code> → <code>{ addText(str, opts), addMesh(mesh), cameraPos(dist), lookAtPoint() }</code> — AE-style staging: sets sit 20–40 units apart in world space, the camera edits between them. <code>buildSceneSequencer({ name: set, ... })</code> drives it: <code>seq.cut(t, 'name')</code>, <code>seq.move(tStart, tEnd, 'from', 'to', ease)</code>, <code>seq.update(t, camera)</code> each frame. It emits <code>follow()</code> keyframes internally, so it stays scrub-safe.</p>\n<p><code>DreambyteCamera.orbit(opts)</code> / <code>.dolly3D(opts)</code> — call inside <code>React.useEffect(() =&gt; {...}, [])</code>. <strong>There is no <code>&lt;DreambyteCamera&gt;</code> JSX tag.</strong></p>\n<h2>Materials</h2>\n<p><code>MATERIALS.&lt;name&gt;(color)</code>: <code>plastic</code>, <code>metal</code>, <code>glass</code>, <code>matte</code>, <code>glow</code>, <code>clearcoat</code>, <code>iridescent</code>, <code>velvet</code>, <code>lowpoly</code>; shader-backed (need <code>updateShaderMaterials</code>) <code>hologram</code>, <code>xray</code>, <code>pulse</code>, <code>fresnel(base, rim, opts)</code>.</p>\n<p>Trap-free: <code>buildToonMaterial</code> (animate <code>mat.uniforms.uLightPos</code>), <code>buildDissolveMaterial</code> (<code>reverse</code> materializes in), <code>buildOutlineMaterial</code> (add the mesh, then a <code>clone()</code> wearing it), <code>enhanceMaterial(THREE, material, opts)</code>, <code>buildMorphBetween(THREE, scene, geoA, geoB, opts)</code> → <code>.setProgress(0-1)</code>, <code>buildMorphingShape</code> → <code>.update(t)</code>, <code>buildVideoTexture(THREE, url, opts)</code> → <code>{ texture, mesh, dispose }</code>. <code>buildMagicMarbleMaterial</code> and <code>buildProceduralMaterial</code> tick via <code>mat.userData.update(t)</code>; marble <strong>cannot</strong> be wrapped by <code>extendMaterial</code>.</p>\n<ul><li><code>buildWaveMaterial(THREE, { amplitude, frequency, speed, axis })</code> — <strong>axis trap:</strong> a plane rotated <code>-PI/2</code> needs <code>axis:'z'</code> for up/down waves; the default <code>'y'</code> displaces forward/back.</li><li><code>extendMaterial(THREE, BaseMaterial, { uniforms, vertexShader, fragmentShader, ... })</code> — shader chunks that keep shadows/fog/lighting; write <code>csm_Position</code>/<code>csm_Normal</code>/<code>csm_DiffuseColor</code>/<code>csm_FragColor</code>/<code>csm_Roughness</code>/<code>csm_Metalness</code>/<code>csm_Emissive</code>. Needs <code>/vendor/three-custom-shader-material.js</code>.</li><li><code>buildCSM(THREE, scene, camera, opts)</code> — set <code>camera.far</code> + <code>updateProjectionMatrix()</code> <strong>before</strong>; <code>csm.setupMaterial(mat)</code> on every caster; <code>csm.update()</code> every frame. Needs <code>/vendor/three-csm.js</code>.</li><li><code>applyPCSS(THREE, material, { lightSize })</code> — soft shadows on a <code>receiveShadow</code> material. <strong>Call before the mesh joins the scene</strong>, else set <code>material.needsUpdate = true</code>.</li><li><code>buildProceduralMaterial(THREE, kind, { scale, color1..3, ... })</code> — shader surfaces instead of image assets. Kinds <code>wood</code>, <code>bricks</code>, <code>concrete</code>, <code>polkaDots</code>, <code>grid</code>, <code>halftone</code>, <code>planet</code>, <code>gasGiant</code> (the only animated one). <code>wood</code>/<code>concrete</code>/<code>planet</code>/<code>gasGiant</code> are world-space — moving the mesh shifts the pattern; the rest UV-space. If the r183 chunk patch no-ops the material renders <strong>flat white</strong>; <code>[Studio3D] procMat=function</code> confirms it loaded.</li><li><code>buildGifTexture(THREE, url, opts)</code> adds <code>.update()</code>, but <strong>GIFs are NOT scrubbable</strong> (browser owns the clock) — transcode to MP4 + <code>buildVideoTexture</code> for frame-accurate sync.</li><li><code>buildProjectedMaterial(THREE, { camera, texture, cover, backgroundOpacity, ... })</code> — <code>mat.project(mesh)</code> once after the mesh is in final position (it bakes world matrices). <code>backgroundOpacity &lt; 1</code> needs <code>transparent: true</code>. InstancedMesh: <code>mat.allocateProjectionData(geo, count)</code> <strong>before</strong> constructing the mesh, then <code>mat.projectInstanceAt(i, inst, matrix)</code>.</li><li><code>mergeTextures(THREE, { key: tex }, opts)</code> / <code>mergeTexturesAsync</code> → <code>{ texture, makeTexture(key), applyToGeometry(geo, key), dispose }</code>. Sync <strong>throws on undecoded images</strong> — use async after <code>TextureLoader.load()</code>. <code>applyToGeometry</code> mutates UVs in place. Never mix sRGB and linear inputs in one atlas.</li></ul>\n<h2>Particles, terrain, connections</h2>\n<p>All <code>(THREE, scene, opts)</code> → object with <code>.update(t)</code>; seeded ones accept <code>seed</code>.</p>\n<p>Trap-free: <code>buildParticleField</code>, <code>buildParticles</code> (<code>shape</code>, <code>.explode(tSinceStart, secs)</code>), <code>buildDataParticles(THREE, scene, points, opts)</code>, <code>buildTrailPath(THREE, scene, [{ t, pos }], opts)</code>, <code>buildProceduralTerrain</code>, <code>buildRippleWater</code>, <code>buildOcean</code>, <code>buildFlatFloor</code>, <code>buildGrass</code>, <code>buildFlyLine</code>, <code>buildInstanced({ layout, getColor(i, rng), ... })</code> → <code>.update(t, fn)</code>, <code>.updateInstance(i, pos, sc, rot)</code>.</p>\n<ul><li><code>buildExplosion(opts)</code> — <strong><code>.update(t - triggerTime)</code>; pass time since trigger, not scene time.</strong></li><li><code>buildCloudField(opts)</code> — <strong><code>.update(t, camera)</code>; the camera arg is required</strong> or billboards don't face the camera.</li><li><code>buildScreenPlane(opts)</code> — draw via <code>screen.ctx.*</code>, then <code>screen.refresh()</code> to push canvas → texture.</li><li><code>buildShatterReveal(THREE, { scene, geometry, texture, count, cubeSize, duration, swarmDistance, stagger, projector })</code> → <code>.update(t)</code>, <code>.setProgress</code>. The target geometry is <strong>not</strong> added to the scene. Keep <code>stagger * duration &lt; duration</code> or the last cubes never arrive; <code>count</code> &gt; ~10000 stalls the CPU matrix loop.</li><li><code>buildConnectionLine(THREE, scene, from, to, opts)</code> → <code>.drawOn(tSinceStart, duration)</code> — GPU draw-on, ≤20 animated edges. Past ~30 use <code>buildInstancedLines(THREE, scene, pairs, opts)</code> → <code>.update(newPairs)</code>.</li><li><code>buildLightShaft({ origin, direction, length, angle, dustCount })</code> — <strong><code>.update(t)</code> required every frame</strong> for dust/flicker.</li></ul>\n<h2>Post-FX &amp; audio</h2>\n<p><code>applyPostFX(renderer, scene, camera, { bloom, vignette, grain, chromaticAberration, lensDistortion, tonemap })</code> — call ONCE in <code>setup</code>; it renders automatically, no <code>update()</code> wiring. Live: <code>setBloomStrength</code>, <code>setLensDistortion</code>, <code>setVignette</code>. Legacy <code>createPostProcessing(renderer, scene, camera, { bloom })</code> needs <code>pp.render()</code> in <code>update</code> instead. Hand-rolled composers must end with <code>OutputPass</code>.</p>\n<p><code>applyDepthOfField(renderer, scene, camera, { focusDistance, aperture, maxBlur, blurPasses, debugCoC })</code> → <code>{ render, setFocus, ... }</code>. Set <code>camera.near</code>/<code>far</code> <strong>before</strong> calling. Register as <code>scene.userData.__dreambyteComposer = { render: () =&gt; dof.render() }</code> and <strong>never call <code>render()</code> yourself</strong>; stash the handle to animate focus from <code>update</code>.</p>\n<p><code>buildGlitchEffect(THREE, renderer, opts)</code> → <code>.setIntensity</code>, <code>.apply(t)</code>. <code>buildTimeline(clips)</code> → <code>{ update(t), add(clip) }</code>, clips <code>{ mesh, prop, from, to, start, end, ease }</code> over <code>position.<em></code>, <code>rotation.</em></code>, <code>scale</code>, <code>material.opacity</code>, <code>visible</code>.</p>\n<p><strong>Audio helpers are runtime-only — they do NOT add a timeline clip and are NOT in the MP4 export audio track.</strong> Use <code>add_track</code> + <code>place_clip</code> (or <code>set_media_layer(kind:'audio')</code>) for real audio.</p>\n<ul><li><code>buildPannedAudio({ src, pan, volume, loop, autoplay })</code> → <code>.setPan(-1..1)</code>, <code>.tick(frame, fps)</code>. Mount once behind a <code>window.__x</code> guard (the React tree re-evaluates every render). <strong><code>tick()</code> every render</strong> or pause/scrub is ignored; <code>setPan()</code> before <code>tick()</code>.</li><li><code>buildPositionalAudio(THREE, { camera, attachTo | scene + position, src, refDistance, rolloff, coneAngle })</code> → <code>.play()</code>, <code>.tick(frame, config.fps)</code>. Async decode queues an early <code>play()</code>; one reused <code>AudioListener</code> per camera.</li></ul>\n<h2>3D text</h2>\n<ul><li><code>buildText3D(THREE, text, { size, color, font, outlineColor, billboard, ... })</code> → Mesh. Canvas plane, <strong>sync</strong>; upgrades to SDF when <code>window._troika</code> is present. Labels and callouts.</li><li><code>buildExtrudedText(THREE, text, { size, depth, bevel, effect, font, perChar, charSpacing, ... }, onReady(group, chars))</code> → group — <strong>hero text</strong>. Async font fetch: the group returns <strong>empty</strong>, so <code>scene.add()</code> it immediately and grab refs in <code>onReady</code>. Fonts <code>helvetiker</code>, <code>helvetiker_bold</code>, <code>optimer</code>, <code>gentilis</code>, <code>droid_sans</code>, <code>droid_serif</code>, <code>mplus</code>. <code>buildTextPath(THREE, text, controlPoints, opts, onReady)</code> is the same contract along a curve.</li><li><code>animateChars(group, t, { entrance:'rise'|'drop'|'pop'|'wave'|'flip'|'scatter'|'fade', delay, duration, distance, amplitude, reverse })</code> — needs <code>perChar: true</code> at build time.</li><li><code>buildTextParticles(THREE, scene, text, opts)</code> → <code>.update(t, { mode:'converge'|'disperse'|'shimmer'|'chaos'|'text', startT, duration })</code>.</li><li><code>applyTextGradient(THREE, group, colorA, colorB, opts)</code> once in <code>onReady</code>; <code>animateTextSweep(THREE, group, t, opts)</code> per frame.</li><li><code>buildNeonSign(THREE, scene, opts)</code> → <code>.update(t)</code>; needs <code>window._troika</code> — before it loads the sign renders as a glowing box. <code>buildCounterAnimation(THREE, scene, opts)</code> → <code>.update(t)</code>.</li><li><code>buildLabel3D(THREE, text, opts)</code> → Sprite; batch via <code>buildSpriteAtlas(THREE, { size })</code> + <code>atlas.label3D(...)</code> (N labels, one GPU upload). Sprites <strong>always billboard</strong>. <code>atlas.dispose()</code> on teardown; <code>releaseLabel(sprite)</code> doesn't reclaim shelf space.</li></ul>\n<p><code>TEXT_EFFECTS</code> keys (shared with <code>buildExtrudedSVG</code> as <code>effect:</code>, or <code>TEXT_EFFECTS.glass(THREE, color)</code> to tweak): <code>glass</code>, <code>chrome</code>, <code>gold</code>, <code>ice</code>, <code>obsidian</code>, <code>neon</code>, <code>pearl</code>, <code>matte</code>. <strong>Bloom only for <code>neon</code> or <code>glow: true</code></strong> — on chrome/gold/glass it reads as fake glow.</p>\n<h2>SVG-to-3D, models</h2>\n<p><code>buildSVG3D(THREE, opts)</code> → <code>Promise&lt;Mesh|Group&gt;</code>. Prefer <code>buildExtrudedSVG(THREE, url, opts, onReady)</code>: <code>effect</code> (TEXT_EFFECTS plus <code>rubber|clay|brushed</code>), <code>bevel</code> (single-color only), <code>fitSize</code> (bbox max-dim → world units, ~3.2), <code>palette</code> (fallback for gradient/<code>url(#...)</code>/none fills), <code>glow</code> + <code>glowColor</code>, <code>color</code> (forces every path; omit and SVG fills flow through), <code>mergeMultiColor: false</code> (escape hatch for per-path animation). <code>depth</code> is in <strong>raw SVG-coord units</strong> — default <code>bbox * 0.18</code>, so hardcoding 20 turns a 24px icon into a tower; <code>bevelThickness</code>/<code>bevelSize</code> derive from it. Multi-color SVGs auto-merge into ONE vertex-colored mesh (bevel auto-off, animate it as a whole). <strong>Never pass <code>csg</code>/<code>csg3d</code></strong> — dead toggles.</p>\n<p><code>setupEnvironment(scene, renderer)</code>, never a bare <code>RGBELoader().load(...)</code> — it lights the <strong>first frame</strong> procedurally, upgrades to HDRI on load, and keeps the fallback on a 404; a bare loader leaves metals dark for ~50–500ms. Pair with <code>THREE.AgXToneMapping</code> + <code>toneMappingExposure = 0.85</code>.</p>\n<p>Models: CC0 GLBs at <code>/models/library/</code>; <code>find_media(kind:'3d')</code> returns a ready-to-load url. After loading, <code>model.scale.setScalar(...)</code> and traverse meshes setting <code>castShadow</code>/<code>receiveShadow</code>.</p>"},{"section":"Skill library","id":"canvas2d-animation","title":"Canvas2D Hand-Drawn Animation","type":"skill","tags":["canvas","canvas2d","hand-drawn","procedural","drawing","whiteboard","chalkboard","pen","marker","chalk","brush"],"html":"<h2>Canvas2D Scenes</h2>\n<p>For <strong>standard animated backgrounds</strong> (starfield, particles, waves, rain/snow, fire haze, EQ bars), write the loop yourself — they are twenty lines each. Make them <strong>scrub-friendly</strong>: derive every position from the timeline <code>t</code>, never from an accumulating frame counter, so seeking backwards reproduces the same frame. Seed variation with <code>mulberry32(seed)</code>, never <code>Math.random()</code>.</p>\n<ul><li>Canvas is WIDTH×HEIGHT (the injected globals — default 1920×1080 but 9:16 / 1:1 / 4:5 projects differ; NEVER hardcode dimensions or non-16:9 exports render wrong)</li><li>Use requestAnimationFrame for animation loops</li><li>Clear with ctx.clearRect(0, 0, WIDTH, HEIGHT) each frame</li><li>Access elapsed time via the getT() pattern in the skeleton</li><li>NEVER use Math.random() — use mulberry32(seed) seeded PRNG (available as a global)</li><li>The canvas renderer is auto-injected — all drawing functions below are globals</li></ul>\n<h2>Drawing Tools — choose based on visual character</h2>\n<ul><li><code>'pen'</code> — fine, precise, hand-drawn lines. Default for diagrams and technical scenes.</li><li><code>'marker'</code> — bold, consistent strokes. Use for titles, thick outlines, emphasis.</li><li><code>'chalk'</code> — rough, grainy, textured. Required for chalkboard scenes. Use white/light colors.</li><li><code>'brush'</code> — wide, tapered, calligraphic. Use for expressive or artistic strokes.</li><li><code>'highlighter'</code> — broad, semi-transparent. Use for underlines and emphasis boxes.</li></ul>\n<h2>Drawing Function Signatures</h2>\n<pre><code>// All animateRough* and animate* functions return Promise&lt;void&gt; — use await\nawait animateRoughLine(ctx, x1, y1, x2, y2, { tool, color, width, seed }, durationMs);\nawait animateRoughCircle(ctx, cx, cy, diameter, { tool, color, seed }, durationMs);\nawait animateRoughRect(ctx, x, y, w, h, { tool, color, fill, fillAlpha, seed }, durationMs);\nawait animateRoughPolygon(ctx, [[x,y],...], { tool, color, seed }, durationMs);\nawait animateRoughCurve(ctx, [[x,y],...], { tool, color, seed }, durationMs);\nawait animateRoughArrow(ctx, x1, y1, x2, y2, { tool, color, seed }, durationMs);\nawait animateLine(ctx, x1, y1, x2, y2, { color, width, seed }, durationMs);\nawait animateCircle(ctx, cx, cy, radius, { color, width, fill, seed }, durationMs);\nawait animateArrow(ctx, x1, y1, x2, y2, { color, width, seed }, durationMs);\n\n// Text is NEVER animated — appears instantly or after a delay\ndrawText(ctx, text, x, y, { size, color, weight, align, font, delay });\n\n// Utilities\nawait fadeInFill(ctx, (ctx) =&gt; { ctx.fillRect(x,y,w,h); }, color, alpha, durationMs);\nawait wait(ms);\nawait drawAsset(ctx, assetId, { x, y, width, height, opacity });\n\n// Texture overlay for chalkboard scenes — call ONCE, not in draw loop\napplyTextureOverlay(canvas, 'chalk', seed);</code></pre>\n<h2>Tool Selection Guide</h2>\n<ul><li>Whiteboard/diagram scene → <code>'pen'</code> or <code>'marker'</code></li><li>Chalkboard scene → <code>'chalk'</code> exclusively; call <code>applyTextureOverlay(canvas, 'chalk', 42)</code> once at start</li><li>Artistic/expressive scene → <code>'brush'</code></li><li>Clean modern scene → <code>animateLine</code> / <code>animateCircle</code> (no roughness)</li><li>Key term highlight → <code>'highlighter'</code> with semi-transparent fill</li></ul>\n<h2>Sequencing Animations</h2>\n<pre><code>async function runScene() {\n  await animateRoughRect(ctx, 100, 100, 400, 300, { tool: 'marker', color: '#3b82f6', seed: 1 }, 500)\n  drawText(ctx, 'Label', 300, 250, { size: 36, color: '#fff', align: 'center' })\n  await animateRoughArrow(ctx, 500, 250, 900, 540, { tool: 'pen', color: '#f97316', seed: 2 }, 400)\n}\nrunScene()</code></pre>\n<h2>Chalkboard Pattern</h2>\n<pre><code>const canvas = document.getElementById('c')\nconst ctx = canvas.getContext('2d')\napplyTextureOverlay(canvas, 'chalk', 42) // once, not in draw loop\n\nasync function runScene() {\n  await animateRoughLine(ctx, 200, 540, 1720, 540, { tool: 'chalk', color: '#f0f0e8', seed: 42 }, 800)\n  drawText(ctx, 'E = mc²', 960, 300, { size: 120, color: '#f0f0e8', align: 'center', font: 'serif', delay: 900 })\n}\nrunScene()</code></pre>"},{"section":"Skill library","id":"d3-data-visualization","title":"D3 Data Visualization","type":"skill","tags":["d3","chart","data","visualization","bar","line","pie","scatter","gauge","dashboard"],"html":"<h2>D3 Scenes — PREFER the <code>chart</code> tool + structured edits</h2>\n<p>For standard charts (bar, line, pie, donut, scatter, area, gauge, number, stacked/grouped bar), use <code>chart</code> with <code>op:'create'</code> (append) and <code>op:'update'</code> / <code>op:'reorder'</code> to edit, <code>remove_layer</code> to delete. These maintain <code>chartLayers</code> and recompile DreambyteCharts — same data the user can edit manually in Layers. No raw D3 code unless necessary.</p>\n<ul><li><code>chart(op:'create')</code>: sceneId, chartType, data, config, animated, optional name, optional layout {x,y,width,height} (percent)</li><li><code>chart(op:'update')</code>: sceneId, chartId (from context), partial fields (data, config, layout, timing, name, chartType, animated)</li><li><code>remove_layer</code>: sceneId, layerId (chart layer ids work here)</li><li><code>chart(op:'reorder')</code>: sceneId, orderedChartIds (every chart id once, back-to-front order)</li><li>Set <code>animated: true</code> for cinematic reveals (bars grow, lines draw, numbers count up). Requires scene duration to be set.</li><li>Data formats: bar/line/area/scatter: [{label, value}]. stacked/grouped: [{label, values: {key: num}}]. pie/donut: [{label, value}]. number: {value, label}. gauge: {value, max}.</li><li>Readability default (IMPORTANT): unless the user explicitly asks for a stylized/minimal look, include clear labels and accessible typography (title, x/y labels when applicable, grid, legend where useful, readable font sizes and contrast).</li><li>If user requests camera animation for a D3 scene, call set_camera_motion with structured moves. Do NOT switch scene type to motion/three just to simulate camera.</li></ul>\n<p>Only use <code>add_layer</code> with layerType 'd3' for exotic/custom visualizations that don't fit any preset chart type.</p>\n<h2>Raw D3 Usage (via add_layer)</h2>\n<p>When using raw D3:</p>\n<ul><li>Use D3 v7 — NO d3.event (use event parameter in callbacks)</li><li>Append to #chart div, NOT body</li><li>viewBox for SVG charts to be responsive</li><li>Use the timeline proxy pattern on window.\\_\\_tl (the master anime.js Timeline, seconds): <code>const s = { p: 0 }; window.__tl.add(s, { p: [0, 1], duration: 0.8, ease: 'outCubic', onUpdate: () =&gt; render(s.p) }, 0.5)</code> — preferred over d3.transition for seekability. Never call play/pause on \\_\\_tl</li><li>NEVER schedule animation with setTimeout/setInterval; sequencing must be timeline positions on window.\\_\\_tl</li></ul>"},{"section":"Skill library","id":"index","title":"Skill Catalog Index","type":"index","tags":["okf","index","routing","skills"],"html":"<p>&lt;!-- GENERATED by scripts/okf/gen-okf-index.ts — do not edit by hand. Edit the file of record, then run <code>npm run gen:okf</code>. --&gt;</p>\n<h1>Skill Catalog Index</h1>\n<ul><li><code>canvas2d-animation</code> — draws expressive hand-drawn / procedural art on a 2D canvas (pen, marker, chalk, brush); reach for it when the scene wants a whiteboard/chalkboard feel, sketched strokes, or particle/procedural texture; skipping risks reaching for SVG or Motion instead gives clean vector geometry that reads as generic, not hand-made.</li><li><code>d3-data-visualization</code> — builds data visualizations and charts (bar, line, pie, scatter, gauge) with D3; reach for it when the scene presents real numeric data, comparisons, or dashboards; skipping risks faking a chart in Motion/SVG yields mis-scaled axes and unreadable data.</li><li><code>lottie-animation</code> — renders precise keyframed vector animations from Lottie/bodymovin JSON; reach for it when the scene needs micro-animations, icon motion, or designer-authored keyframe control; skipping risks approximating Lottie motion in CSS drops the precise easing and motion personality.</li><li><code>motion-css-animation</code> — orchestrates layout-heavy explainers with the anime.js master timeline, text splitting, and DreambyteMotion; reach for it when the scene is text reveals, staggered element entrances, or a typographic explainer beat; skipping risks hand-rolling reveals without the timeline produces uncoordinated, janky staggers.</li><li><code>svg-animation</code> — animates clean vector graphics with CSS/SMIL inside an SVG viewBox; reach for it when the content is simple flat vector shapes that need lightweight, crisp motion; skipping risks using Canvas2D or Three.js over-engineers a flat graphic and loses vector crispness.</li><li><code>threejs-3d-scene</code> — composes immersive 3D scenes with PBR materials, environments, and camera flyovers (Three.js r183); reach for it when the content is genuinely spatial — 3D products, environments, WebGL effects, 3D scatter; skipping risks simulating depth in 2D looks flat; stacking 3D on a 2D idea wastes a heavy renderer.</li></ul>"},{"section":"Skill library","id":"lottie-animation","title":"Lottie Animation","type":"skill","tags":["lottie","bodymovin","json","vector","animation","keyframes","easing","motion-personality","quality-score"],"html":"<h2>Lottie in Dreambyte</h2>\n<h3>Three ways to use Lottie</h3>\n<ol><li><strong><code>find_media(kind:'lottie', query, count)</code></strong> (preferred for complex animations)</li></ol>\n<ul><li>Search the curated library by visual keyword (icon, illustration, transition, loader, celebration, data-viz, character, abstract)</li><li>Returns URLs for pre-made professional animations</li><li>Use <code>DreambyteMotion.lottieSync()</code> in motion scenes or <code>LottieFromURL</code> in React scenes</li></ul>\n<ol><li><strong>Generated Lottie</strong> (simple geometric only)</li></ol>\n<ul><li>AI generates raw Lottie JSON via <code>/api/generate-lottie</code></li><li>Supports <code>motionPersonality</code> parameter (playful, premium, corporate, energetic)</li><li>Auto-validated: missing easing handles are fixed before render</li><li>Quality scored: 5-dimension analysis (visual, technical, emotional, performance, completeness)</li><li>Use <code>&lt;LottieLayer data={json} /&gt;</code> in React scenes</li></ul>\n<ol><li><strong>DreambyteMotion components</strong> (no Lottie needed)</li></ol>\n<ul><li>For text reveals, fades, counters, progress bars — use DreambyteMotion directly</li><li>Simpler, more reliable, better performance</li></ul>\n<h3>Auto-Validation Pipeline</h3>\n<p>Generated Lottie JSON passes through <code>validateLottieJSON()</code> + <code>scoreLottieQuality()</code>:</p>\n<ol><li><strong>Structure check</strong>: Required fields (v, fr, ip, op, w, h, layers)</li><li><strong>Easing handle check</strong>: Every animated keyframe (except last) must have <code>i</code>/<code>o</code> bezier handles</li><li><strong>Auto-fix</strong>: Missing handles injected with safe corporate defaults (the #1 crash cause, now eliminated)</li><li><strong>Dimensionality check</strong>: 1D handles for opacity/rotation, 3D for position/scale/anchor</li><li><strong>Quality score</strong> (0-100): visual, technical, emotional, performance, completeness</li></ol>\n<h3>Motion Personality Integration</h3>\n<p>Call <code>choose_motion_style</code> before generating Lottie to get personality-specific easing:</p>\n<pre><code>choose_motion_style({ sceneContext: \"opening hook\", emotion: \"excitement\" })\n→ { personality: \"energetic\", easing: { entrance: { lottie1d: {...}, lottie3d: {...} } } }</code></pre>\n<p>The generate-lottie API accepts <code>motionPersonality</code> to inject the right easing curves into the prompt.</p>\n<h3>Lottie JSON Structure</h3>\n<ul><li>Canvas: w=WIDTH, h=HEIGHT, fr=30 — match the project dimensions (injected globals; default 1920×1080 but varies by aspect ratio, never hardcode)</li><li>Keyframe easing handles (CRITICAL):</li><li>1D: <code>\"i\": {\"x\":[0.58],\"y\":[1]}, \"o\": {\"x\":[0.42],\"y\":[0]}</code></li><li>3D: <code>\"i\": {\"x\":[0.58,0.58,0.58],\"y\":[1,1,1]}, \"o\": {\"x\":[0.42,0.42,0.42],\"y\":[0,0,0]}</code></li><li>Shape types: el (ellipse), rc (rect), sr (star), sh (bezier path), fl (fill), st (stroke), gr (group)</li><li>Layer ty: 4 = shape layer, 1 = solid</li></ul>\n<h3>Narrative Structure for Generated Lotties</h3>\n<p>Distribute keyframes across three phases:</p>\n<ul><li><strong>Setup</strong> (0-25% of frames): Elements appear, establish positions. Use entrance easing.</li><li><strong>Action</strong> (25-65%): Primary animation. Use emphasis/personality easing.</li><li><strong>Resolution</strong> (65-100%): Settle to final state. Hold or gentle ambient.</li></ul>\n<h3>LottieLayer in React Scenes</h3>\n<p>lottie-web is loaded globally. Use <code>&lt;LottieLayer data={json} /&gt;</code> for inline JSON or build a <code>LottieFromURL</code> component for URL-based loading.</p>\n<p>Canvas renderer available for performance: <code>&lt;LottieLayer data={json} renderer=\"canvas\" /&gt;</code></p>\n<h3>When NOT to Use Lottie</h3>\n<ul><li>Text animations → use <code>interpolate()</code> or <code>DreambyteMotion.textReveal()</code></li><li>Element reveals → use <code>interpolate()</code> + <code>spring()</code></li><li>Counting numbers → use <code>DreambyteMotion.countUp()</code></li><li>Bar charts → use <code>&lt;D3Layer&gt;</code> or <code>chart(op:'create')</code></li><li>Simple fades/slides → pure JSX animation</li></ul>"},{"section":"Skill library","id":"motion-css-animation","title":"Motion / anime.js Animation","type":"skill","tags":["motion","anime","css","animation","text-split","svg-draw","svg-morph","dreambytemotion","timeline"],"html":"<h2>Motion Scenes</h2>\n<ul><li>All animation timing MUST go through <code>window.__tl</code> — the master anime.js Timeline. The global <code>anime</code> (v4.5) is preloaded and <code>anime.engine.timeUnit = 's'</code>: every duration, delay, stagger and position is in <strong>seconds</strong>.</li><li>Prefer declarative <code>tl.add(target, params, position)</code> tweens per beat; a proxy tweened 0→1 with <code>onUpdate</code> is the fallback for effects a tween can't express.</li><li>NEVER call <code>play()</code>/<code>pause()</code>/<code>seek()</code> on <code>window.__tl</code> (the player owns playback). NEVER use standalone <code>anime.animate()</code> / <code>anime.createTimeline()</code> for scene motion, <code>setTimeout</code>, <code>setInterval</code>, or <code>requestAnimationFrame</code>.</li><li>Use flexbox/grid for layout — NEVER position:absolute with pixel values (causes overflow)</li><li>Use clamp(), vw/vh, percentages for responsive sizing</li><li>CSS @keyframes for entrance animations so content shows before play is pressed</li><li>Do NOT redeclare template globals (DURATION, WIDTH, HEIGHT, PALETTE, etc.)</li></ul>\n<h2>Timeline authoring (anime.js v4)</h2>\n<pre><code>const tl = window.__tl\ntl.label('beat2', 3.2) // named position\ntl.add('.headline', { y: [60, 0], opacity: [0, 1], duration: 0.7, ease: 'outExpo' }, 0.2) // ENTER — first child needs a number\n  .add('.subhead', { x: ['-6%', '0%'], opacity: [0, 1], duration: 0.5, ease: 'outQuart' }, '&lt;&lt;+=0.15') // 0.15s after previous START\n  .add('.card', { y: [40, 0], opacity: [0, 1], duration: 0.5, ease: 'outCubic', delay: anime.stagger(0.08) }, '&lt;+=0.2')\n  .add(['.headline', '.subhead'], { y: -40, opacity: 0, duration: 0.4, ease: 'inQuart' }, 'beat2') // EXIT\n  .set('#panel-2', { opacity: 1 }, 'beat2') // instant state at a time</code></pre>\n<ul><li><strong>Position (3rd arg):</strong> number = absolute seconds (preferred) · <code>'beat2'</code> label · <code>'&lt;'</code> previous child's end · <code>'&lt;&lt;'</code> previous child's start · <code>'&lt;+=0.4'</code> / <code>'&lt;&lt;+=0.15'</code> offsets. Omitted = end of timeline. The first child has no previous child — give it a number.</li><li><strong>Values:</strong> <code>opacity: 1</code> (to) · <code>opacity: [0, 1]</code> (from→to) · <code>opacity: { from: 0 }</code> (from→current) · <code>scale: { to: 1.2, ease: 'outBack(1.7)', duration: 0.3 }</code> (per-property). Transforms <code>x y z rotate rotateX rotateY scale scaleX scaleY skew</code>, percent strings OK (<code>x: '-50%'</code>). No <code>xPercent</code> / <code>rotation</code> / <code>autoAlpha</code>. transform-origin goes in CSS.</li><li><strong>Stagger:</strong> <code>delay: anime.stagger(0.08)</code> · <code>anime.stagger(0.05, { from: 'center' })</code> · <code>anime.stagger([0, 0.6])</code> · <code>{ grid: [cols, rows], from: 'center' }</code> · as a position: <code>tl.add('.dot', {...}, anime.stagger(0.1, { start: 1 }))</code>.</li><li><strong>Easing (exact names):</strong> <code>'linear'</code>, <code>'out(3)'</code>/<code>'in(3)'</code>/<code>'inOut(3)'</code>, in/out/inOut + Quad Cubic Quart Quint Sine Expo Circ Bounce (<code>'outExpo'</code>, <code>'inOutSine'</code>), <code>'outBack(1.7)'</code>, <code>'outElastic(1, .4)'</code>. Functions, not strings: <code>anime.cubicBezier(.16, 1, .3, 1)</code>, <code>anime.steps(6)</code>, <code>anime.linear(0, .5, 1)</code>, <code>anime.spring({ bounce: .35, duration: 0.6 })</code>. <strong>Unknown ease names silently become linear</strong>; the strings <code>'steps(6)'</code> / <code>'cubicBezier(..)'</code> are invalid.</li><li><strong>Counter:</strong> <code>tl.add('#revenue', { innerHTML: [0, 1250], modifier: anime.utils.round(0), duration: 1.5 }, 1)</code></li><li><strong>SVG draw:</strong> <code>const [line] = anime.svg.createDrawable('#line'); tl.add(line, { draw: ['0 0', '0 1'], duration: 1.2, ease: 'inOutQuad' }, 0.5)</code> — <code>createDrawable</code> returns an <strong>array</strong>.</li><li><strong>Morph:</strong> <code>tl.add('#shapeA', { d: anime.svg.morphTo('#shapeB'), duration: 0.8 }, 2)</code> (polygons animate <code>points</code>).</li><li><strong>Motion path:</strong> <code>tl.add('#dot', { ...anime.svg.createMotionPath('#track'), duration: 3, ease: 'linear' }, 0)</code></li><li><strong>Text split:</strong> <code>const { chars, words } = anime.text.split('#title', { chars: true, words: true }); tl.add(chars, { y: ['100%', '0%'], opacity: [0, 1], duration: 0.5, delay: anime.stagger(0.03) }, 0.2)</code>. Masked reveal: <code>{ words: { wrap: 'clip' } }</code>. Typewriter: chars with <code>opacity: [0, 1], duration: 0.01, delay: anime.stagger(0.05)</code>. Never <code>scrambleText</code> (random → not seekable).</li><li><strong>Proxy (canvas / three / d3):</strong> <code>const s = { p: 0 }; tl.add(s, { p: [0, 1], duration: 0.8, onUpdate: draw }, 1); draw()</code> — or <code>window.__dreambyte.onTick((t) =&gt; render(t))</code>; current time <code>window.__dreambyte.time()</code>.</li></ul>\n<h2>DreambyteMotion Component Library (available in all scene types)</h2>\n<p>All scenes load DreambyteMotion — pre-built components that add tweens to the master timeline. Use these instead of hand-writing tweens for common patterns (pass <code>tl</code>; times in seconds; <code>ease</code> options take anime names like <code>'outExpo'</code>).</p>\n<h3>TEXT ANIMATIONS — prefer DreambyteMotion.textReveal (text splitting handled for you):</h3>\n<pre><code>DreambyteMotion.textReveal('.title', { style: 'chars', tl }) // character stagger\nDreambyteMotion.textReveal('.subtitle', { style: 'words', tl }) // word stagger\nDreambyteMotion.textReveal('.headline', { style: 'mask', tl }) // cinematic mask reveal\nDreambyteMotion.textReveal('.code', { style: 'typewriter', tl }) // typing effect\nDreambyteMotion.textReveal('.intro', { style: 'scatter', tl }) // chars fly in from random positions</code></pre>\n<h3>ELEMENT REVEALS:</h3>\n<pre><code>DreambyteMotion.fadeUp('.element', { tl, delay: 0.3 })\nDreambyteMotion.staggerIn('.cards .card', { tl, stagger: 0.1, from: 'start', direction: 'up' })\nDreambyteMotion.scaleIn('.icon', { tl, ease: 'outBack(1.7)' })\nDreambyteMotion.slideIn('.panel', { from: 'right', tl })\nDreambyteMotion.floatIn('.card', { direction: 'up', tl })\nDreambyteMotion.flipReveal('.card', { axis: 'Y', tl })</code></pre>\n<h3>NUMBERS &amp; PROGRESS:</h3>\n<pre><code>DreambyteMotion.countUp('#revenue', { to: 2400000, format: ',.0f', prefix: '$', tl })\nDreambyteMotion.countUp('#growth', { to: 47, suffix: '%', tl })\nDreambyteMotion.countUp('#users', { to: 1200000, format: '.2s', tl }) // → 1.2M\nDreambyteMotion.progressBar('.bar', { to: 73, tl })</code></pre>\n<h3>SVG (line draw, morph, motion path):</h3>\n<pre><code>DreambyteMotion.drawPath('.chart-line path', { tl })\nDreambyteMotion.morphShape('#icon', { to: '#icon-target', tl })\nDreambyteMotion.pathFollow('.arrow', { path: '#flow-path', tl })</code></pre>\n<h3>HIGHLIGHT:</h3>\n<pre><code>DreambyteMotion.highlightReveal('.keyword', { color: '#FFE066', style: 'background', tl })</code></pre>\n<h3>PRE-MADE LOTTIE ILLUSTRATIONS:</h3>\n<pre><code>// First: find_media({ kind: 'lottie', query: 'checkmark success' }) → get URL\n// Then: DreambyteMotion.lottieSync('#lottie-wrap', { src: url, tl, delay: 0.3 })</code></pre>\n<p>For custom animations not covered by DreambyteMotion, write anime.js tweens on <code>window.__tl</code> directly (see Timeline authoring above).</p>"},{"section":"Skill library","id":"svg-animation","title":"SVG Vector Animation","type":"skill","tags":["svg","vector","animation","smil","css-animation","viewbox"],"html":"<h2>SVG Scenes</h2>\n<ul><li>Set viewBox to the project size: <code>viewBox={\"0 0 \" + WIDTH + \" \" + HEIGHT}</code> (WIDTH/HEIGHT are injected globals — default 1920×1080 but 9:16 / 1:1 / 4:5 differ; never hardcode)</li><li>Animate with CSS animations or SMIL, not JS character-by-character text</li><li>Use the global palette colors from world state</li><li>Apply stroke-width from global style</li><li>Use seeded randomness: const rand = mulberry32(SEED);</li></ul>\n<h2>When to Use SVG</h2>\n<ul><li>Clean vector illustrations with simple animations</li><li>Logo animations, icon sequences</li><li>Scenes where sharp scaling matters</li><li>Simple path morphing or drawing effects</li></ul>\n<h2>Gotchas</h2>\n<ul><li>SVG animations can't be seeked accurately — avoid for timeline-critical content</li><li>No particle systems or complex procedural art</li><li>Large SVG DOMs (1000+ elements) cause performance issues</li></ul>"},{"section":"Skill library","id":"threejs-3d-scene","title":"Three.js 3D Scene","type":"skill","tags":["three","threejs","3d","webgl","scene","camera","mesh","material","environment"],"html":"<h2>Scene contract — READ FIRST</h2>\n<ul><li>A <code>three</code> scene is a <strong>raw vanilla-JS script</strong>, NOT a React component. Do NOT use React, JSX, <code>export default</code>, <code>useEffect</code>, <code>React.createElement</code>, or a <code>&lt;div ref&gt;</code> — <code>React</code> is not defined in this context and the scene will throw.</li><li><strong>Frame clock only — NEVER drive your own loop.</strong> Do not call <code>requestAnimationFrame</code>, <code>performance.now</code>, <code>Date.now</code>, or define a <code>loop()</code>. Drive all motion from the master anime.js timeline (seconds): define <code>window.__updateScene = (t) =&gt; renderAtTime(t)</code> (t = seconds) and/or sequence with <code>window.__tl</code>. The renderer seeks frames deterministically; wall-clock timing breaks frame-accurate export.</li><li>Never hardcode 1920×1080 — read <code>WIDTH</code>/<code>HEIGHT</code> from <code>window</code>.</li></ul>\n<h2>Three.js Scenes</h2>\n<ul><li>Use <strong>Three.js r183</strong> via ES modules: <code>import * as THREE from 'three';</code> and read <code>WIDTH, HEIGHT, PALETTE, DURATION, MATERIALS, mulberry32, setupEnvironment, applyDreambyteThreeEnvironment, updateDreambyteThreeEnvironment</code> from <code>window</code>.</li><li>Set <code>window.__threeCamera = camera</code> for editor camera moves.</li><li><strong>Stage environment:</strong> call <code>applyDreambyteThreeEnvironment(envId, scene, renderer, camera)</code> once for a full backdrop + lighting rig. Each frame call <code>updateDreambyteThreeEnvironment(window.__tl?.time?.() ?? t)</code> so animated envs scrub with the timeline. Ids: <code>studio_white</code> | <code>cinematic_fog</code> | <code>iso_playful</code> | <code>tech_grid</code> | <code>nature_sunset</code> | <code>data_lab</code> | <code>track_rolling_topdown</code>. Unknown ids fall back to <code>studio_white</code>.</li><li><strong>3D scatter plots:</strong> <code>createDreambyteDataScatterplot(scene, { points: [{x,y,z}, …], pointRadius, color })</code> returns instanced spheres + RGB axes, auto-centered and scaled to the stage; call <code>updateDreambyteDataScatterplot(t, { orbitSp
